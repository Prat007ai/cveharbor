name = "cveharbor-accounts"
main = "src/index.js"
compatibility_date = "2026-10-28"
keep_vars = true

[vars]
WINDOWS_AGENT_ENABLED = "false"
AGENT_EMAIL_ENABLED = "false"
AGENT_SUPPORT_EMAIL = "prat.mahen@gmail.com"
AGENT_DISTRIBUTION = "evaluation"
INTELLIGENCE_SOURCE = "r2"
RECOVERY_CONTROL_REQUIRED = "true"
CVIE_SHARED_SCANS_ENABLED = "true"
EMAIL_FROM = "alerts@cveharbor.com"
ASSIGNMENT_EMAIL_ENABLED = "true"
ASSIGNMENT_ACK_ENABLED = "true"
ASSIGNMENT_FYI_ENABLED = "true"
REMEDIATION_WORKFLOW_ENABLED = "true"
ASSIGNMENT_PROGRESS_ENABLED = "true"
ASSIGNMENT_ACK_TTL_SECONDS = "604800"
PLUGIN_MONITOR_ENABLED = "true"
WEBSITE_MONITOR_MANUAL_ENABLED = "true"
WEBSITE_MONITOR_ENABLED = "false"
WEB_RISK_BILLING_ALERT_EMAIL = "pmahendran@whitecapcanada.com"
WEB_RISK_ALERT_TEST_ENABLED = "true"

[[r2_buckets]]
binding = "INTELLIGENCE_BUCKET"
bucket_name = "cveharbor-intelligence"

[[d1_databases]]
binding = "DB"
database_name = "cveharbor-accounts"
database_id = "46710e51-7ca4-4571-b89c-921b9969de0b"

# After deployment and testing, add the api.cveharbor.com custom domain in Cloudflare.
# Store SMTP2GO_API_KEY as an encrypted Worker runtime secret, never in GitHub.
# EMAIL_FROM is a non-sensitive, verified sender address defined above.

# Hourly tick, daily deliveries at 08:00 America/Toronto. No sending until ALERT_DELIVERY_ENABLED=true.
[triggers]
crons = ["5 * * * *", "*/5 * * * *", "* * * * *"]

# Public acknowledgement traffic; no D1 writes on GET and no token in the rate key.
[[ratelimits]]
name = "ASSIGNMENT_ACK_RATE_LIMITER"
namespace_id = "23501"
simple = { limit = 60, period = 60 }

[build]
command = "node ../scripts/build_release_identity.mjs"

[[ratelimits]]
name = "AGENT_RATE_LIMITER"
namespace_id = "23502"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "AGENT_SOURCE_RATE_LIMITER"
namespace_id = "23503"
simple = { limit = 600, period = 60 }

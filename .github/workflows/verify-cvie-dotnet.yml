name: Verify Microsoft .NET identity without deployment
on:
  push:
    branches: [fix/cvie-dotnet-history]
    paths: ['account-backend/**','cvie.js','scripts/*dotnet*.mjs','.github/workflows/verify-cvie-dotnet.yml']
permissions:
  contents: write
concurrency:
  group: cvie-dotnet-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check authoritative .NET product identities
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: node scripts/probe_dotnet_directory.mjs
      - name: Inspect aggregate .NET Core scan identities without reading customer records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import sys,json,datetime
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from verify_cvie_production import query
          rows=query("SELECT cpe,status,COUNT(*) AS jobs FROM cvie_products WHERE name_key IN ('.net core','microsoft .net core') GROUP BY cpe,status")
          Path('data/cvie-dotnet-runtime-check.json').write_text(json.dumps({'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':'public CPE identifiers and aggregate job status only; no account/customer data','identities':rows},indent=2)+'\n')
          PY
      - name: Record non-secret provider evidence
        env:
          CVIE_CHECK_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'cveharbor-updater[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cvie-dotnet-directory-check.json data/cvie-dotnet-runtime-check.json
          git commit -m 'Record public .NET identity compatibility evidence'
          git push origin "HEAD:$CVIE_CHECK_BRANCH"
      - name: Require a successful directory check
        run: node -e "if(!require('./data/cvie-dotnet-directory-check.json').ok)process.exit(1)"

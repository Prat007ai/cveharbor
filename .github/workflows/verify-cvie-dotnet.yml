name: Verify Microsoft .NET identity without deployment
on:
  workflow_dispatch:
  push:
    branches: [fix/cvie-dotnet-history]
    paths: ['account-backend/**','cvie.js','scripts/*dotnet*.mjs','scripts/cvie_client_smoke.mjs','.github/workflows/verify-cvie-dotnet.yml']
permissions:
  contents: read
concurrency:
  group: cvie-dotnet-verification
  cancel-in-progress: false
jobs:
  verify:
    name: verify-cvie-dotnet / verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check authoritative .NET product identities
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: node scripts/probe_dotnet_directory.mjs
      - name: Verify account behavior and .NET regression cases
        run: npm test --prefix account-backend && node account-backend/tests/cvie-dotnet.test.mjs
      - name: Verify website build and shared interaction behavior
        run: |
          python scripts/build_site.py
          python scripts/verify_production.py --preflight
          npm install --no-save --no-package-lock jsdom@26
          node scripts/browser_smoke.mjs
          node scripts/customer_security_smoke.mjs
          node scripts/cvie_client_smoke.mjs
      - name: Verify real modern .NET history and original Microsoft disclosures
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: node scripts/probe_cvie_dotnet.mjs
      - name: Require a successful directory check
        run: node -e "for(const file of ['cvie-dotnet-directory-check','cvie-dotnet-check'])if(!require('./data/'+file+'.json').ok)process.exit(1)"
      - name: Retain diagnostic evidence without repository writes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-cvie-dotnet-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            data/cvie-*-check.json

  production-readonly:
    name: verify-cvie-dotnet production metadata
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: cloudflare-production-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Inspect aggregate .NET Core scan identities without reading customer records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_AUDIT_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import sys,json,datetime
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from verify_cvie_production import query
          rows=query("SELECT cpe,status,COUNT(*) AS jobs FROM cvie_products WHERE name_key IN ('.net core','microsoft .net core') GROUP BY cpe,status")
          Path('data/cvie-dotnet-runtime-check.json').write_text(json.dumps({'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':'public CPE identifiers and aggregate job status only; no account/customer data','identities':rows},indent=2)+'\n')
          PY
      - name: Retain diagnostic evidence without repository writes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-cvie-dotnet-production-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            data/cvie-*-runtime-check.json
            data/cvie-runtime-check.json

name: Complete temporary site gate activation
on:
  push:
    branches: [feat/temporary-site-gate]
    paths:
      - .github/workflows/check-site-gate-hosting.yml
      - scripts/check_site_gate_hosting.py
      - site-gate/**
      - scripts/deploy_site_gate.py
      - scripts/disable_public_pages_origin.py
      - scripts/site_gate_client.py
      - tests/test_site_gate_deployment.py
      - scripts/complete_site_gate_activation.py
permissions:
  contents: write
  pages: write
concurrency:
  group: cveharbor-site-production
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the site gate and existing application
        run: python -m unittest discover -s tests -v && node --test site-gate/tests/*.test.mjs
      - name: Build and validate the protected frontend package
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: python scripts/build_site.py && python scripts/verify_production.py --preflight && npx --yes wrangler@4.156.0 deploy --config site-gate/wrangler.json --dry-run
      - name: Read domain and hosting configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_GATE_PASSWORD: ${{ secrets.SITE_GATE_PASSWORD }}
          SITE_GATE_TOKEN_SOURCE: ${{ secrets.CLOUDFLARE_SITE_API_TOKEN != '' && 'dedicated_frontend' || 'existing_deployment' }}
        run: python scripts/check_site_gate_hosting.py
      - name: Complete the requested password-gate activation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_GATE_PASSWORD: ${{ secrets.SITE_GATE_PASSWORD }}
          SITE_GATE_USERNAME: cveharbor
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: python scripts/complete_site_gate_activation.py
      - name: Save non-secret diagnostic evidence on this development branch
        env:
          DIAGNOSTIC_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'cveharbor-updater[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/site-gate-hosting.json data/site-gate-activation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record redacted site gate activation evidence'
          git push origin HEAD:"$DIAGNOSTIC_BRANCH"
      - name: Require complete gate activation
        run: python -c "import json; assert json.load(open('data/site-gate-activation.json'))['success'], 'See redacted activation evidence for the failed step'"

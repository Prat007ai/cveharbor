name: Check temporary site gate hosting
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: check-site-gate-hosting / check
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: cloudflare-production-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test the site gate and existing application
        run: python -m unittest discover -s tests -v && node --test site-gate/tests/*.test.mjs
      - name: Build and validate the protected frontend package
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: python scripts/build_site.py && python scripts/verify_production.py --preflight && npx --yes wrangler@4.156.0 deploy --config site-gate/wrangler.json --dry-run
      - name: Read domain and hosting configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_AUDIT_ACCOUNT_ID }}
          SITE_GATE_PASSWORD: ${{ secrets.CVEHARBOR_SITE_GATE_PASSWORD }}
          SITE_GATE_TOKEN_SOURCE: ${{ 'protected_audit' }}
        run: python scripts/check_site_gate_hosting.py
      - name: Retain diagnostic evidence without repository writes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-gate-hosting-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            data/site-gate-hosting.json

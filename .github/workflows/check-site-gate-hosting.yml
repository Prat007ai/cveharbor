name: Check temporary site gate hosting
on:
  push:
    branches: [feat/temporary-site-gate]
    paths:
      - .github/workflows/check-site-gate-hosting.yml
      - scripts/check_site_gate_hosting.py
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read domain and hosting configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_GATE_PASSWORD: ${{ secrets.SITE_GATE_PASSWORD }}
        run: python scripts/check_site_gate_hosting.py
      - name: Save non-secret diagnostic evidence on this development branch
        env:
          DIAGNOSTIC_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'cveharbor-updater[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/site-gate-hosting.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record read-only site gate hosting diagnostics'
          git push origin HEAD:"$DIAGNOSTIC_BRANCH"

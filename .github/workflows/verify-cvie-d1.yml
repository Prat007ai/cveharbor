name: Verify CVIE queries against production D1 without customer data
on:
  push:
    branches: [fix/cvie-status-d1, fix/cvie-navigation-resume, perf/cvie-read-usage, feat/cvie-shared-product-scans]
    paths: ['account-backend/**', 'cvie.js', 'app.js', 'scripts/cvie_client_smoke.mjs', 'scripts/cvie_polling_smoke.mjs', 'scripts/probe_cvie_shared.mjs', 'scripts/verify_cvie_d1.mjs', '.github/workflows/verify-cvie-d1.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scan continuity, subscription changes and private account isolation
        run: npm test --prefix account-backend
      - name: Verify status refresh and account-change behavior in the browser client
        run: |
          npm install --no-save --no-package-lock jsdom@26
          node scripts/cvie_client_smoke.mjs
          node scripts/cvie_polling_smoke.mjs
      - name: Add the shared schema without changing production runtime behavior
        if: github.ref_name == 'feat/cvie-shared-product-scans'
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.0 d1 execute cveharbor-accounts --remote --file=migrations/0022_cvie_shared_scans.sql
      - name: Verify one real provider page is reused by two isolated accounts
        if: github.ref_name == 'feat/cvie-shared-product-scans'
        id: shared_provider
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: node scripts/probe_cvie_shared.mjs
      - name: Exercise the actual production database query contracts with synthetic identities
        id: probe
        continue-on-error: true
        env:
          CVIE_SHARED_SCANS_ENABLED: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify_cvie_d1.mjs
      - name: Record only query outcomes and public schema metadata
        env:
          CVIE_CHECK_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'cveharbor-updater[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cvie-d1-check.json
          if test -f data/cvie-shared-check.json; then git add data/cvie-shared-check.json; fi
          git commit -m 'Record read-only production D1 CVIE query check'
          git push origin "HEAD:$CVIE_CHECK_BRANCH"
      - name: Require successful production query checks
        env:
          VERIFY_SHARED: ${{ github.ref_name == 'feat/cvie-shared-product-scans' }}
        run: node -e "if(!require('./data/cvie-d1-check.json').ok||process.env.VERIFY_SHARED==='true'&&!require('./data/cvie-shared-check.json').ok)process.exit(1)"

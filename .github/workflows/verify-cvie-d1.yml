name: Verify CVIE queries against production D1 without customer data
on:
  push:
    branches: [fix/cvie-status-d1]
    paths: ['account-backend/**', 'scripts/verify_cvie_d1.mjs', '.github/workflows/verify-cvie-d1.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise the actual production database query contracts with synthetic identities
        id: probe
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify_cvie_d1.mjs
      - name: Record only query outcomes and public schema metadata
        env:
          CVIE_CHECK_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'cveharbor-updater[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cvie-d1-check.json
          git commit -m 'Record read-only production D1 CVIE query check'
          git push origin "HEAD:$CVIE_CHECK_BRANCH"
      - name: Require successful production query checks
        run: node -e "if(!require('./data/cvie-d1-check.json').ok)process.exit(1)"

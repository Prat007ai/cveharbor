name: Verify CVIE development contracts without production access
on:
  push:
    branches: [fix/cvie-status-d1, fix/cvie-navigation-resume, perf/cvie-read-usage, feat/cvie-shared-product-scans]
    paths: ['account-backend/**', 'cvie.js', 'app.js', 'scripts/cvie_client_smoke.mjs', 'scripts/cvie_polling_smoke.mjs', 'scripts/probe_cvie_shared.mjs', 'scripts/bootstrap_cvie_shared.mjs', 'scripts/cvie_rest_batch.mjs', 'scripts/cvie_rest_batch.test.mjs', 'scripts/verify_cvie_d1.mjs', '.github/workflows/verify-cvie-d1.yml']
permissions:
  contents: read
jobs:
  verify:
    name: verify-cvie-d1 / verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify scan continuity, subscription changes and private account isolation
        run: npm test --prefix account-backend
      - name: Verify status refresh and account-change behavior in the browser client
        run: |
          npm install --no-save --no-package-lock jsdom@26
          node scripts/cvie_client_smoke.mjs
          node scripts/cvie_polling_smoke.mjs
      - name: Verify one real provider page is reused by two isolated accounts
        if: github.ref_name == 'feat/cvie-shared-product-scans'
        id: shared_provider
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: node scripts/probe_cvie_shared.mjs
      - name: Retain diagnostic evidence without repository writes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cvie-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            data/cvie-shared-check.json

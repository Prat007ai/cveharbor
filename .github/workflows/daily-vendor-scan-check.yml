name: Daily production vendor scan check
on:
  schedule:
    - cron: '43 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-production-vendor-scan-check
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test zero, incomplete and positive scan handling
        run: python -m unittest discover -s scripts -p test_monitor_version_scans.py
      - name: Probe both windows on the production site
        env:
          SITE_GATE_PASSWORD: ${{ secrets.SITE_GATE_PASSWORD }}
        run: python scripts/monitor_version_scans.py probe "$RUNNER_TEMP/live-scans.json"
      - name: Install public advisory parsers
        run: python -m pip install ijson==3.4.0.post0 zstandard==0.25.0
      - name: Cross-check empty results with public vendor evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/monitor_version_scans.py compare "$RUNNER_TEMP/live-scans.json"

  notify:
    needs: compare
    if: always() && github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && needs.compare.result != 'skipped'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Open or resolve the owner’s scan monitoring incident
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECK_RESULT: ${{ needs.compare.result }}
        run: python scripts/monitor_scan_incident.py

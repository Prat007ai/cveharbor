name: Daily production vendor scan check
run-name: Vendor scan check ${{ inputs.day || 'daily coverage watchdog' }}
on:
  schedule:
    - cron: '43 13 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: Last complete UTC date scanned
        required: true
        type: string
      scan_results:
        description: Public product versions and observed scan categories
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: daily-vendor-check-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test monitoring logic
        run: python -m unittest discover -s scripts -p test_monitor_version_scans.py
      - name: Install public advisory parsers
        run: python -m pip install ijson==3.4.0.post0 zstandard==0.25.0
      - name: Check every empty category against public vendor evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCAN_RESULTS: ${{ inputs.scan_results }}
          SCAN_DAY: ${{ inputs.day }}
        run: python scripts/monitor_version_scans.py compare
  watchdog:
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check the daily production comparison completed successfully
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/monitor_version_scans.py watchdog

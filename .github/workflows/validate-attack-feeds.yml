name: Validate public attack feed integrations

on:
  push:
    branches-ignore: [main]
    paths:
      - .github/workflows/validate-attack-feeds.yml
      - scripts/update_threats.py
      - scripts/validate_attack_feeds.py
      - tests/test_threats.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attack-feed-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate-attack-feeds / validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate live public attack feeds and full exports
        run: python scripts/validate_attack_feeds.py
      - name: Retain diagnostic evidence without repository writes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validate-attack-feeds-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            data/attack-feed-validation

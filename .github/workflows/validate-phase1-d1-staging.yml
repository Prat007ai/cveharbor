name: Phase 1 isolated D1 staging rehearsal (no production deployment)
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [validate, bootstrap]
        default: validate
        required: true
permissions:
  contents: read
concurrency:
  group: cveharbor-phase1-staging
  cancel-in-progress: false
jobs:
  staging:
    environment: cloudflare-phase1-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rehearse only against the explicitly isolated synthetic database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_STAGING_ACCOUNT_ID }}
          STAGING_DATABASE_ID: ${{ vars.STAGING_DATABASE_ID }}
          STAGING_DATABASE_NAME: ${{ vars.STAGING_DATABASE_NAME }}
          STAGING_DISPOSABLE: ${{ vars.STAGING_DISPOSABLE }}
          STAGING_OPERATION: ${{ inputs.operation }}
        run: node scripts/staging_workflow.mjs

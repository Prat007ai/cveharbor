name: Read-only remediation production integrity audit
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [preflight, installed]
        default: preflight
        description: 'Preflight works before 0031; installed also verifies recovery protections'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: cloudflare-worker-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute SELECT-only audit; never deploy, migrate, or send mail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUDIT_PHASE: ${{ inputs.phase }}
        run: node scripts/audit_phase1.mjs

name: Installed product assessment
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    name: Product assessment / scoped package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Reproduce the serving baseline and exact assessment delta
        run: |
          python scripts/installed_products_release.py backend "$RUNNER_TEMP/products-backend"
          cp -r account-backend/tests "$RUNNER_TEMP/products-backend/account-backend/tests"
          cp account-backend/package.json "$RUNNER_TEMP/products-backend/account-backend/package.json"
          cp inventory-matching.js "$RUNNER_TEMP/products-backend/inventory-matching.js"
          mkdir -p "$RUNNER_TEMP/products-backend/deployment/proposals/server-network"
          cp deployment/proposals/server-network/schema.sql "$RUNNER_TEMP/products-backend/deployment/proposals/server-network/schema.sql"
          node --test "$RUNNER_TEMP/products-backend/account-backend/tests/installed-products.test.mjs" "$RUNNER_TEMP/products-backend/account-backend/tests/agents.test.mjs" "$RUNNER_TEMP/products-backend/account-backend/tests/cvie.test.mjs" "$RUNNER_TEMP/products-backend/account-backend/tests/cvie-evidence.test.mjs" "$RUNNER_TEMP/products-backend/account-backend/tests/cvie-shared.test.mjs"
          node --test scripts/installed_product_assessment.test.mjs scripts/matching_confidence.test.mjs scripts/inventory_async.test.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-collector-package
          path: collector-app/package
          run-id: 43264633230
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-agent-evaluation
          path: windows-agent/package/release
          run-id: 43535697624
          github-token: ${{ github.token }}
      - name: Verify the scoped website and unchanged installer
        run: |
          python scripts/installed_products_release.py prepare "$RUNNER_TEMP/products-site"
          npm install --prefix staging --ignore-scripts --no-package-lock
          AGENT_TEST_SITE="$RUNNER_TEMP/products-site/after" node scripts/agent_browser.mjs
          PRODUCT_ASSESSMENT_TEST=true SERVER_TEST_SITE="$RUNNER_TEMP/products-site/after" node scripts/server_security_browser.mjs
          INVENTORY_TEST_SITE="$RUNNER_TEMP/products-site/after" node scripts/inventory_experience_browser.mjs

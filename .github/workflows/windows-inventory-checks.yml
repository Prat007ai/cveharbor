name: Windows inventory workflow checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test the collector exporter using fictional data in PowerShell
        run: pwsh -NoProfile -File scripts/test_windows_collector.ps1
  workflow:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26
      - run: npm install --prefix staging --ignore-scripts --no-package-lock
      - run: node --test scripts/asset_import.test.mjs scripts/server_security.test.mjs account-backend/tests/inventory-import.test.mjs
      - run: node scripts/import_workflow_smoke.mjs
      - name: Verify the exact backend package and unchanged AI behavior
        run: |
          python -c "import sys;from pathlib import Path;sys.path.insert(0,'scripts');import team_release as t;t.previous('a1b34899baab89348c2fb22aac831342d6d87212','windows_inventory_release.py','backend',Path(sys.argv[1]))" "$RUNNER_TEMP/inventory-worker"
          rsync --archive --delete "$RUNNER_TEMP/inventory-worker/account-backend/src/" account-backend/src/
          cp "$RUNNER_TEMP/inventory-worker/account-backend/wrangler.toml" account-backend/wrangler.toml
          node --test account-backend/tests/inventory-import.test.mjs account-backend/tests/team-access.test.mjs account-backend/tests/ai-*.test.mjs account-backend/tests/azure-connection.test.mjs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-collector-package
          path: collector-app/package
          run-id: 43264633230
          github-token: ${{ github.token }}
      - name: Verify the isolated website using fictional inventory
        run: |
          python scripts/inventory_capacity_release.py prepare "$RUNNER_TEMP/inventory-site"
          SERVER_TEST_SITE="$RUNNER_TEMP/inventory-site/after" SERVER_SCREENSHOTS="$RUNNER_TEMP/inventory-screens" node scripts/server_security_browser.mjs
          INVENTORY_TEST_SITE="$RUNNER_TEMP/inventory-site/after" INVENTORY_SCREENSHOTS="$RUNNER_TEMP/inventory-screens" node scripts/inventory_browser.mjs
          INVENTORY_TEST_SITE="$RUNNER_TEMP/inventory-site/after" INVENTORY_SCREENSHOTS="$RUNNER_TEMP/inventory-screens" node scripts/inventory_experience_browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inventory-review-screens
          path: ${{ runner.temp }}/inventory-screens
          if-no-files-found: error
  mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify historical mapping and test the current outage package with AI paused
        run: |
          python -c "import os,sys;from pathlib import Path;sys.path.insert(0,'scripts');import team_release as t;t.previous('04ada0f76a35e61c01fdce198b1df0fd6c7edfd9','dotnet_mapping_release.py','build',Path(os.environ['RUNNER_TEMP'])/'mapping-baseline')"
          python scripts/nvd_outage_release.py backend "$RUNNER_TEMP/mapping-worker"
          rsync --archive --delete "$RUNNER_TEMP/mapping-worker/account-backend/src/" account-backend/src/
          cp "$RUNNER_TEMP/mapping-worker/account-backend/wrangler.toml" account-backend/wrangler.toml
          node --test account-backend/tests/dotnet-inventory-mapping.test.mjs account-backend/tests/cvie.test.mjs account-backend/tests/cvie-dotnet.test.mjs account-backend/tests/cvie-evidence.test.mjs account-backend/tests/cvie-shared.test.mjs account-backend/tests/product-chooser.test.mjs account-backend/tests/inventory-import.test.mjs account-backend/tests/team-access.test.mjs account-backend/tests/ai-*.test.mjs account-backend/tests/azure-connection.test.mjs

  network:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/server_network_schema.mjs --rehearse
      - name: Verify exact network package and paused AI
        run: |
          python scripts/inventory_capacity_release.py backend "$RUNNER_TEMP/network-worker"
          rsync --archive --delete "$RUNNER_TEMP/network-worker/account-backend/src/" account-backend/src/
          cp "$RUNNER_TEMP/network-worker/account-backend/wrangler.toml" account-backend/wrangler.toml
          node --test account-backend/tests/server-network.test.mjs account-backend/tests/inventory-import.test.mjs account-backend/tests/team-access.test.mjs account-backend/tests/ai-*.test.mjs account-backend/tests/azure-connection.test.mjs

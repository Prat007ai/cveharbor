# Owner approved this additional protected staging caller on 2026-11-13.
name: Isolated Cloudflare inventory capacity test
on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Exact reviewed main commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs.reviewed_commit == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-collector-package
          path: collector-app/package
          run-id: 43264633230
          github-token: ${{ github.token }}
      - run: python scripts/dashboard_read_release.py backend verification/capacity-backend
      - run: python scripts/report_interaction_release.py prepare verification/capacity-site
      - run: node --test account-backend/tests/versioned-read-cache.test.mjs account-backend/tests/dashboard-read-capacity.test.mjs account-backend/tests/inventory-capacity.test.mjs scripts/inventory_capacity_cloud.test.mjs scripts/nvd_capacity.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capacity-backend
          path: verification/capacity-backend
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: capacity-site
          path: verification/capacity-site/after
          retention-days: 14
  cloud-load:
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs.reviewed_commit == github.sha
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-cvie-staging
    concurrency:
      group: cveharbor-capacity-load
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: capacity-backend
          path: verification/capacity-backend
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: capacity-site
          path: verification/capacity-site/after
      - run: npm install --prefix staging --ignore-scripts --no-package-lock
      - name: Execute only the isolated synthetic capacity rehearsal
        env:
          CLOUDFLARE_ACCOUNT_ID: '9706b4d98ad72884e67fd1eb875c8a61'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_STAGING_API_TOKEN }}
          CAPACITY_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          CAPACITY_BACKEND_DIR: verification/capacity-backend
        run: node scripts/inventory_capacity_cloud.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: capacity-cloud-result
          path: capacity-cloud-result.json
          retention-days: 14

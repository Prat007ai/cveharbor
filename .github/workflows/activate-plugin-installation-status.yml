name: Activate WordPress Plugin Installation Status
on:
  workflow_dispatch:
    inputs:
      backup_confirmed:
        type: boolean
        required: true
        default: false
      apply_confirmed:
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: cveharbor-worker-production
  cancel-in-progress: false
jobs:
  migrate:
    name: activate-plugin-installation-status / migrate
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOYMENTS_ENABLED == 'true' && (inputs.backup_confirmed == true && inputs.apply_confirmed == true)
    runs-on: ubuntu-latest
    environment: cloudflare-worker-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test account Worker
        working-directory: account-backend
        run: npm test
      - name: Add plugin installation status storage
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 d1 execute cveharbor-accounts --remote --file=./plugin-source-schema.sql --yes

name: Activate plugin source URLs in D1
on:
  workflow_dispatch:
    inputs:
      backup_confirmed:
        description: 'I have a current independent production D1 backup'
        required: true
        type: boolean
        default: false
      apply_confirmed:
        description: 'I approve adding the plugin source mapping table'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cveharbor-worker-production
  cancel-in-progress: false
jobs:
  migrate:
    if: inputs.backup_confirmed == true && inputs.apply_confirmed == true
    runs-on: ubuntu-latest
    environment: cloudflare-worker-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify plugin source API tests
        working-directory: account-backend
        run: npm test
      - name: Apply only plugin source mapping schema
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 d1 execute cveharbor-accounts --remote --file=./plugin-source-schema.sql --yes

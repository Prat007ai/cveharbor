name: Security and application validation
on:
  pull_request:
  push:
    branches: [main, security/phase1-deployment-boundaries]
permissions:
  contents: read
jobs:
  policy:
    name: Security / workflow policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/check_workflow_security.py
      - run: python -m unittest discover -s tests -p test_workflow_security.py -v
      - run: node --test scripts/check_phase1_staging_boundary.test.mjs
  regression:
    name: CI / application regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s tests -v
      - run: npm test --prefix account-backend && node --test site-gate/tests/*.test.mjs
      - run: python scripts/build_site.py && python scripts/verify_production.py --preflight
      - run: npm install --no-save --no-package-lock jsdom@26
      - run: node scripts/browser_smoke.mjs && node scripts/customer_security_smoke.mjs && node scripts/product_monitoring_smoke.mjs
  nvd-package:
    name: CI / NVD outage production package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Reproduce the serving backend and enforce the one-file delta
        run: python scripts/nvd_outage_release.py backend "$RUNNER_TEMP/nvd-backend"
      - name: Test outages and isolation against the exact backend
        run: |
          cp -r account-backend/tests "$RUNNER_TEMP/nvd-backend/account-backend/tests"
          cp account-backend/package.json "$RUNNER_TEMP/nvd-backend/account-backend/package.json"
          cp inventory-matching.js "$RUNNER_TEMP/nvd-backend/inventory-matching.js"
          node --test "$RUNNER_TEMP/nvd-backend/account-backend/tests/cvie.test.mjs" "$RUNNER_TEMP/nvd-backend/account-backend/tests/cvie-evidence.test.mjs" "$RUNNER_TEMP/nvd-backend/account-backend/tests/cvie-shared.test.mjs"
          python -m unittest discover -s tests -p test_nvd_outage.py -v

      - name: Reproduce the dashboard capacity delta and verify its read boundaries
        run: |
          python -c "import sys;from pathlib import Path;sys.path.insert(0,'scripts');import team_release as t;t.previous('da927ac147b130930a870be1a65f4e80b9ae4450','dashboard_read_release.py','backend',Path(sys.argv[1]))" "$RUNNER_TEMP/dashboard-read-backend"
          cp -r account-backend/tests "$RUNNER_TEMP/dashboard-read-backend/account-backend/tests"
          cp account-backend/package.json "$RUNNER_TEMP/dashboard-read-backend/account-backend/package.json"
          cp inventory-matching.js "$RUNNER_TEMP/dashboard-read-backend/inventory-matching.js"
          cp inventory-client.js "$RUNNER_TEMP/dashboard-read-backend/inventory-client.js"
          cp -r scripts deployment "$RUNNER_TEMP/dashboard-read-backend/"
          node --test "$RUNNER_TEMP/dashboard-read-backend/account-backend/tests/versioned-read-cache.test.mjs" "$RUNNER_TEMP/dashboard-read-backend/account-backend/tests/dashboard-read-capacity.test.mjs" "$RUNNER_TEMP/dashboard-read-backend/account-backend/tests/inventory-capacity.test.mjs" "$RUNNER_TEMP/dashboard-read-backend/account-backend/tests/inventory-read-db.test.mjs" "$RUNNER_TEMP/dashboard-read-backend/account-backend/tests/recovery-control.test.mjs" "$RUNNER_TEMP/dashboard-read-backend/account-backend/tests/cvie-shared.test.mjs"

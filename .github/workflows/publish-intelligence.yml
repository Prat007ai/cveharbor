name: Hourly vulnerability intelligence (data only)
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      vendor_only:
        description: Refresh only installed-product vendor advisories
        type: boolean
        default: false
      initialize:
        description: Seed the empty production bucket from the reviewed original snapshot
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cveharbor-intelligence-publisher
  cancel-in-progress: false
jobs:
  collect:
    name: Collect and atomically publish intelligence
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && vars.FEED_PUBLICATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    # Main-only environment, no human approval per run. ONLY bucket-scoped keys.
    # Application production environments retain independent approval requirements.
    environment: cloudflare-intelligence-data
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install data storage client
        run: python -m pip install boto3==1.40.70 ijson==3.4.0.post0 zstandard==0.25.0
      - name: Initialize only on explicit first dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.initialize == true && !inputs.vendor_only
        env:
          FEED_R2_ACCOUNT_ID: ${{ vars.FEED_R2_ACCOUNT_ID }}
          FEED_R2_BUCKET: ${{ vars.FEED_R2_BUCKET }}
          FEED_R2_ACCESS_KEY_ID: ${{ secrets.FEED_R2_ACCESS_KEY_ID }}
          FEED_R2_SECRET_ACCESS_KEY: ${{ secrets.FEED_R2_SECRET_ACCESS_KEY }}
        run: python scripts/initialize_intelligence_feed.py
      - name: Refresh vendor scan evidence when due
        env:
          FEED_R2_ACCOUNT_ID: ${{ vars.FEED_R2_ACCOUNT_ID }}
          FEED_R2_BUCKET: ${{ vars.FEED_R2_BUCKET }}
          FEED_R2_ACCESS_KEY_ID: ${{ secrets.FEED_R2_ACCESS_KEY_ID }}
          FEED_R2_SECRET_ACCESS_KEY: ${{ secrets.FEED_R2_SECRET_ACCESS_KEY }}
        run: |
          python scripts/vendor_scan_data.py
          python scripts/catalogue_advisory_data.py
      - name: Restore durable state, collect all sources, verify objects and promote once
        if: ${{ !inputs.vendor_only && !cancelled() }}
        id: collect
        env:
          FEED_R2_ACCOUNT_ID: ${{ vars.FEED_R2_ACCOUNT_ID }}
          FEED_R2_BUCKET: ${{ vars.FEED_R2_BUCKET }}
          FEED_R2_ACCESS_KEY_ID: ${{ secrets.FEED_R2_ACCESS_KEY_ID }}
          FEED_R2_SECRET_ACCESS_KEY: ${{ secrets.FEED_R2_SECRET_ACCESS_KEY }}
          FEED_RECEIPT_PATH: ${{ runner.temp }}/feed-receipt.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          WORDFENCE_API_KEY: ${{ secrets.WORDFENCE_API_KEY }}
          MALWAREBAZAAR_API_KEY: ${{ secrets.MALWAREBAZAAR_API_KEY }}
          THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY || secrets.MALWAREBAZAAR_API_KEY }}
        run: python scripts/feed_snapshot.py collect
      - name: Refresh the public installed-version directory
        if: ${{ !cancelled() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure') }}
        env:
          FEED_R2_ACCOUNT_ID: ${{ vars.FEED_R2_ACCOUNT_ID }}
          FEED_R2_BUCKET: ${{ vars.FEED_R2_BUCKET }}
          FEED_R2_ACCESS_KEY_ID: ${{ secrets.FEED_R2_ACCESS_KEY_ID }}
          FEED_R2_SECRET_ACCESS_KEY: ${{ secrets.FEED_R2_SECRET_ACCESS_KEY }}
        run: python scripts/technology_releases.py --publish
      - name: Retain the public snapshot receipt
        if: always() && !inputs.vendor_only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: feed-receipt
          path: ${{ runner.temp }}/feed-receipt.json
          if-no-files-found: warn
          retention-days: 7

name: Verify Microsoft Hyper-V identity without deployment
on:
  push:
    branches: [fix/cvie-hyperv-identity]
    paths: ['account-backend/**','scripts/probe_hyperv_directory.mjs','.github/workflows/verify-cvie-hyperv.yml']
permissions:
  contents: write
concurrency:
  group: cvie-hyperv-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check authoritative public Hyper-V product identities
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: node scripts/probe_hyperv_directory.mjs
      - name: Record non-secret directory evidence
        env:
          CVIE_CHECK_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'cveharbor-updater[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cvie-hyperv-directory-check.json
          git commit -m 'Record public Microsoft Hyper-V directory evidence'
          git push origin "HEAD:$CVIE_CHECK_BRANCH"
      - name: Require a successful directory check
        run: node -e "if(!require('./data/cvie-hyperv-directory-check.json').ok)process.exit(1)"

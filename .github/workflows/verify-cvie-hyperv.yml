name: Verify Microsoft Hyper-V identity without deployment
on:
  push:
    branches: [fix/cvie-hyperv-identity]
    paths: ['account-backend/**','app.js','cvie.js','scripts/*hyperv*.mjs','scripts/cvie_client_smoke.mjs','.github/workflows/verify-cvie-hyperv.yml']
permissions:
  contents: write
concurrency:
  group: cvie-hyperv-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify account behavior and Hyper-V regression cases
        run: npm test --prefix account-backend && node account-backend/tests/cvie-hyperv.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify website build and shared matching behavior
        run: |
          python scripts/build_site.py
          python scripts/verify_production.py --preflight
          npm install --no-save --no-package-lock jsdom@26
          node scripts/browser_smoke.mjs
          node scripts/customer_security_smoke.mjs
          node scripts/cvie_client_smoke.mjs
      - name: Check authoritative public Hyper-V product identities
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: node scripts/probe_hyperv_directory.mjs
      - name: Verify real Hyper-V host selection, NVD history and original Microsoft disclosures
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: node scripts/probe_cvie_hyperv.mjs
      - name: Record non-secret directory evidence
        env:
          CVIE_CHECK_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'cveharbor-updater[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cvie-hyperv-directory-check.json data/cvie-hyperv-check.json
          git commit -m 'Record public Microsoft Hyper-V directory evidence'
          git push origin "HEAD:$CVIE_CHECK_BRANCH"
      - name: Require a successful directory check
        run: node -e "for(const file of ['cvie-hyperv-directory-check','cvie-hyperv-check'])if(!require('./data/'+file+'.json').ok)process.exit(1)"

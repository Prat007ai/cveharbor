name: CVIE phase 0-2 isolated verification
on:
  pull_request:
    paths: ['account-backend/**', 'scripts/cvie*.mjs', 'cvie.js', '.github/workflows/cvie-phase012.yml']
permissions:
  contents: read
jobs:
  local-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm test --prefix account-backend
      - run: node scripts/cvie_readonly_sql.test.mjs
      - run: python -m unittest discover -s tests -p test_update.py
      - run: npm install --no-save --no-package-lock jsdom@26
      - run: node scripts/cvie_client_smoke.mjs && node scripts/cvie_polling_smoke.mjs && node scripts/cvie_fast_onboarding_smoke.mjs
# The old PR-triggered repository-secret production baseline job is retired.
# Production diagnostics use the separately approved protected audit workflow.

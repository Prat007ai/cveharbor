name: Activate approved confirmation email hostname
on:
  push:
    branches: [main]
    paths: ['.github/workflows/activate-confirmation-domain.yml', 'scripts/verify_confirmation_domain.mjs', 'scripts/verify_confirmation_domain.test.mjs']
  pull_request:
    paths: ['.github/workflows/activate-confirmation-domain.yml', 'scripts/verify_confirmation_domain.mjs', 'scripts/verify_confirmation_domain.test.mjs']
permissions:
  contents: read
concurrency:
  group: cveharbor-production-release
  cancel-in-progress: false
jobs:
  release-ready:
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify application and security checks for this production commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/production_release_checks.py
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test scripts/verify_confirmation_domain.test.mjs
      - run: npm test --prefix account-backend
      - name: Verify attached production hostname without changing configuration
        # PRs run local tests only, including when this workflow is in the PR diff.
        if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: node scripts/verify_confirmation_domain.mjs
  activate:
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOYMENTS_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, release-ready]
    runs-on: ubuntu-latest
    environment: cloudflare-worker-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Respect recovery hold before production changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_release_hold.mjs
      - name: Require the approved compatible Worker release
        run: git merge-base --is-ancestor 4004859b66a37942fa606b7d8fbaeddd4c674c8f HEAD
      - name: Verify new hostname HTTPS and guest-only routes before changing email links
        run: node scripts/verify_confirmation_domain.mjs
      - name: Verify migration and existing private API boundaries without customer writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_remediation_workflow_d1.mjs --after
      - name: Check candidate Worker against the live production database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/production_worker_preflight.mjs
      - name: Deploy current Worker with approved confirmation origin
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.0 deploy --config wrangler.toml --var ASSIGNMENT_CONFIRM_ORIGIN:https://confirm.cveharbor.com
      - name: Verify live accounts release and authentication boundary
        run: node scripts/production_service_health.mjs
      - name: Verify live confirmation origin and both hostname boundaries
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_confirmation_domain.mjs --runtime

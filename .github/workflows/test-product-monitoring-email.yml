name: One approved SMTP2GO monitoring test per authorized recipient
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cveharbor-approved-product-monitor-test
  cancel-in-progress: false
jobs:
  test:
    permissions:
      contents: read
      actions: read
    name: test-product-monitoring-email / test
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && vars.PRODUCTION_EMAIL_TESTS_ENABLED == 'true'
    environment: cloudflare-notifications-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Submit only the two expressly approved test messages if an existing CI key is available
        env:
          SMTP2GO_API_KEY: ${{ secrets.CVEHARBOR_PROD_SMTP2GO_API_KEY }}
          EMAIL_FROM: alerts@cveharbor.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/test_monitor_smtp2go.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: product-monitoring-approved-test-20261101
          path: work/product-monitoring-smtp-test.json
          retention-days: 30

name: Retire the former public application origin
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retire-public-site-origin.yml
      - scripts/build_retired_pages_origin.py
permissions:
  contents: read
concurrency:
  group: cveharbor-pages-retirement
  cancel-in-progress: false
jobs:
  retire:
    permissions:
      contents: read
      pages: write
      id-token: write
    name: retire-public-site-origin / retire
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require a working password-protected replacement first
        env:
          SITE_GATE_PASSWORD: ${{ secrets.CVEHARBOR_SITE_GATE_PASSWORD }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0,'scripts')
          from deploy_site_gate import probe
          probe('https://cveharbor.com',True,'cveharbor',os.environ['SITE_GATE_PASSWORD'])
          print('Protected replacement verified before retiring the former origin')
          PY
      - name: Build only the retirement notice
        run: python scripts/build_retired_pages_origin.py
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: retired-pages-origin
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

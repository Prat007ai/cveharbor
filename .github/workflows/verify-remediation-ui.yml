name: Verify live CVEHarbor remediation UI

on:
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - workspace.js
      - operations.js
      - accounts.js
      - .github/workflows/verify-remediation-ui.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Check published D1 tracker UI and assignment actions
    runs-on: ubuntu-latest
    env:
      SITE_GATE_USERNAME: cveharbor
      SITE_GATE_PASSWORD: ${{ secrets.SITE_GATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm frontend serves new tracker and assignment dialog
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from site_gate_client import install_site_auth
          install_site_auth()
          import urllib.request
          import urllib.error
          import time
          import re
          base='https://cveharbor.com'
          paths=['/remediation/?remediation_check=d1-assignments-1',
                 '/operations.js',
                 '/app.js',
                 '/accounts.js']
          last=''
          for attempt in range(1,16):
              try:
                  contents=[]
                  for path in paths:
                      req=urllib.request.Request(base+path,headers={
                        'User-Agent':'CVEHarbor-Remediation-Live-Check/1.0',
                        'Cache-Control':'no-cache'
                      })
                      with urllib.request.urlopen(req,timeout=18) as response:
                          contents.append(response.read(200000).decode('utf-8'))
                  html,tracker,app,accounts=contents
                  checks={
                    'assignment dialog published':'id="remediationAssignDialog"' in html,
                    'versioned tracker deployed':re.search(r'src="/operations\.js\?v=[a-zA-Z0-9-]+"',html) is not None,
                    'private workspace message':'private CVEHarbor workspace' in html,
                    'reviewer activity dialog':'id="remediationProgressDialog"' in html,
                    'reviewer capability check':'reviewer_updates_available' in tracker,
                    'tracker sends authenticated requests':"credentials:'include'" in tracker,
                    'tracker uses cloud feature checks':'/remediations/features' in tracker,
                    'indexed CVE has assignment action':'cveharbor:assign-remediation' in app,
                    'account announces auth changes':'cveharbor:account-state' in accounts,
                    'old watchlist remains intact':'id="accountSaveStack"' in html
                  }
                  if all(checks.values()):
                      print('PASS: production frontend contains the account-based remediation tracker UI')
                      for name,good in checks.items():print(name,good)
                      break
                  last=', '.join(name for name,good in checks.items() if not good)
              except (urllib.error.URLError,TimeoutError,ValueError) as error:
                  last=type(error).__name__+' '+str(getattr(error,'code',''))
              print('Attempt',attempt,'site not yet ready:',last)
              if attempt==15:raise SystemExit('Live UI verification failed: '+last)
              time.sleep(12)
          print('Cloudflare Worker activation is a separate approved deployment.')
          PY

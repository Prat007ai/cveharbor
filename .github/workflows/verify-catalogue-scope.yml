name: Verify catalogue scope on production D1 without writes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: verify-catalogue-scope / verify
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: cloudflare-production-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run SELECT-only scope and aggregate checks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_AUDIT_ACCOUNT_ID }}
        run: node scripts/verify_catalogue_scope_d1.mjs
      - name: Verify public Windows Server product choices without customer writes
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: node scripts/verify_product_directory.mjs

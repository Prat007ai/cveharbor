name: Activate customer DevOps ticket references
on:
  workflow_dispatch:
    inputs:
      backup_confirmed:
        description: 'I have an up to date independent production D1 backup'
        type: boolean
        required: true
        default: false
      apply_confirmed:
        description: 'I approve the additive customer ticket schema migration'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: cveharbor-production-release
  cancel-in-progress: false
jobs:
  migrate:
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOYMENTS_ENABLED == 'true' && inputs.backup_confirmed == true && inputs.apply_confirmed == true
    runs-on: ubuntu-latest
    environment: cloudflare-worker-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Respect recovery hold before production changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_release_hold.mjs
      - name: Run account backend tests
        working-directory: account-backend
        run: npm test
      - name: Apply additive DevOps ticket table
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 d1 execute cveharbor-accounts --remote --file=./finding-ticket-schema.sql --yes

      - name: Cover any newly introduced tables with recovery guards
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/refresh_recovery_guards.mjs

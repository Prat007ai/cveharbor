name: Activate Customer Security Score History
on:
  workflow_dispatch:
    inputs:
      backup_confirmed:
        type: boolean
        required: true
        default: false
        description: 'I have a current independent D1 backup'
      apply_confirmed:
        type: boolean
        required: true
        default: false
        description: 'I approve additive score history schema migration'
permissions:
  contents: read
concurrency:
  group: cveharbor-production-release
  cancel-in-progress: false
jobs:
  migrate:
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOYMENTS_ENABLED == 'true' && inputs.backup_confirmed == true && inputs.apply_confirmed == true
    runs-on: ubuntu-latest
    environment: cloudflare-worker-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Respect recovery hold before production changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_release_hold.mjs
      - name: Verify backend and scoring
        run: |
          cd account-backend && npm test && cd ..
          node scripts/customer_score_smoke.mjs
      - name: Add customer score history table
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 d1 execute cveharbor-accounts --remote --file=./customer-score-schema.sql --yes

      - name: Cover any newly introduced tables with recovery guards
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/refresh_recovery_guards.mjs

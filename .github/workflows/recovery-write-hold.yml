name: Controlled recovery write hold (no deployment)
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [status, hold, freeze, resume]
        default: status
        required: true
      expected_revision:
        description: 'Revision from the most recent status check; required for hold/resume'
        type: string
      reason:
        description: 'Change reference and operational reason; no customer data or secrets'
        type: string
permissions:
  contents: read
concurrency:
  group: cveharbor-production-release
  cancel-in-progress: false
jobs:
  control:
    if: github.ref == 'refs/heads/main'
    environment: cloudflare-worker-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute explicitly selected control operation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RECOVERY_OPERATION: ${{ inputs.operation }}
          EXPECTED_HOLD_REVISION: ${{ inputs.expected_revision }}
          RECOVERY_REASON: ${{ inputs.reason }}
        run: node scripts/recovery_workflow.mjs

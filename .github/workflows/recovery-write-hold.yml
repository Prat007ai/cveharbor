name: Controlled recovery write hold (no deployment)
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [status, hold, freeze, resume]
        default: status
        required: true
      expected_revision:
        description: 'Revision from the most recent status check; required for hold/resume'
        type: string
      reason:
        description: 'Change reference and operational reason; no customer data or secrets'
        type: string
permissions:
  contents: read
concurrency:
  group: cveharbor-production-release
  cancel-in-progress: false
jobs:
  control:
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: cloudflare-worker-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Execute explicitly selected control operation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
          RECOVERY_OPERATION: ${{ inputs.operation }}
          EXPECTED_HOLD_REVISION: ${{ inputs.expected_revision }}
          RECOVERY_REASON: ${{ inputs.reason }}
        run: node scripts/recovery_workflow.mjs

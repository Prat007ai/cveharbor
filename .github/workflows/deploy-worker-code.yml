name: Deploy Cloudflare Worker code after backend changes
on:
  push:
    branches: [main]
    paths:
      - 'release/**'
      - 'scripts/production_forward_migrations.mjs'
      - 'scripts/release_migrations.mjs'
      - 'scripts/production_release_checks.py'
      - 'account-backend/src/**'
      - 'data/lifecycle-products.json'
      - 'account-backend/tests/**'
      - 'account-backend/migrations/0019_cvie.sql'
      - 'account-backend/migrations/0020_cvie_evidence.sql'
      - 'account-backend/migrations/0021_cvie_audit_refresh.sql'
      - 'account-backend/migrations/0022_cvie_shared_scans.sql'
      - 'account-backend/wrangler.toml'
      - 'scripts/verify_cvie_production.py'
      - 'scripts/verify_cvie_d1.mjs'
      - 'scripts/bootstrap_cvie_shared.mjs'
      - 'scripts/cvie_rest_batch.mjs'
      - 'scripts/cvie_rest_batch.test.mjs'
      - 'scripts/worker_release_mode.mjs'
      - 'scripts/worker_release_smoke.mjs'
      - 'scripts/verify_software_history_d1.mjs'
      - 'scripts/verify_workspace_d1.mjs'
      - 'scripts/verify_assignment_ack_d1.mjs'
      - 'account-backend/migrations/0024_assignment_acknowledgements.sql'
      - 'account-backend/migrations/0025_assignment_fyi.sql'
      - 'account-backend/migrations/0026_remediation_workflow.sql'
      - 'scripts/verify_remediation_workflow_d1.mjs'
      - 'account-backend/migrations/0027_assignment_progress.sql'
      - 'account-backend/migrations/0028_unified_findings.sql'
      - 'scripts/verify_unified_findings_d1.mjs'
      - 'account-backend/migrations/0029_finding_assignment_links.sql'
      - 'scripts/verify_finding_links_d1.mjs'
      - 'account-backend/migrations/0030_status_update_notifications.sql'
      - 'scripts/verify_status_mail_d1.mjs'
      - 'account-backend/migrations/0031_remediation_integrity.sql'
      - 'account-backend/migrations/0032_recovery_control.sql'
      - 'scripts/recovery_control.mjs'
      - 'scripts/build_release_identity.mjs'
      - 'scripts/cloudflare_d1.mjs'
      - 'scripts/verify_remediation_integrity_d1.mjs'
      - 'scripts/verify_assignment_progress_d1.mjs'
      - 'scripts/verify_assignment_fyi_d1.mjs'
      - '.github/workflows/deploy-worker-code.yml'
  workflow_dispatch:
    inputs:
      assignment_release:
        description: Release only the staged reviewer email and reminder changes from PR 291
        type: boolean
        default: false
      query_fix_287:
        description: Release only the reviewed PR 287 backend after its verified staging run
        type: boolean
        default: false
      release_mode:
        description: 'Explicit release operation; code-only never runs migrations or maintenance'
        type: choice
        options: [code-only, recovery-code-only, phase1-integrity, cvie-maintenance]
        default: code-only
        required: true

permissions:
  contents: read

jobs:
  release-ready:
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify application and security checks for this production commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/production_release_checks.py
  deploy:
    concurrency:
      group: cveharbor-production-release
      cancel-in-progress: false
    needs: release-ready
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOYMENTS_ENABLED == 'true'
    name: Validate and deploy account Worker
    runs-on: ubuntu-latest
    environment: cloudflare-worker-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Require the native migration switch for an explicit maintenance release
        if: inputs.release_mode == 'cvie-maintenance'
        env:
          NATIVE_MIGRATIONS_ENABLED: ${{ vars.SIMPLE_RELEASE_ENABLED }}
        run: test "$NATIVE_MIGRATIONS_ENABLED" = true
      - name: Determine code-only release scope
        id: mode
        env:
          WORKER_RELEASE_MODE: ${{ inputs.release_mode || 'code-only' }}
        run: node scripts/worker_release_smoke.mjs && node scripts/worker_release_mode.mjs
      - name: Verify account backend
        working-directory: account-backend
        run: npm test && node ../scripts/cvie_rest_batch.test.mjs && node --check src/index.js && node --check src/plugin-advisories.js
      - name: Select and check the exact assignment Worker verified in staging
        if: inputs.assignment_release == true
        run: |
          python scripts/assignment_release.py backend release/.build/investigation-backend
          rsync --archive --delete release/.build/investigation-backend/account-backend/src/ account-backend/src/
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {backendIdentity} from './scripts/build_release_identity.mjs';
          import {verifyService} from './scripts/production_service_health.mjs';
          assert.equal(backendIdentity(),JSON.parse(fs.readFileSync('release/assignment-291.json')).backend_identity);
          await verifyService({expectedRelease:'738b07a3eee67dc5a3d872dfb4ccbbe5ba2aab628b8c964e820b7b69aea63ce8'});
          JS
          node --test account-backend/tests/assignment-*.test.mjs
      - name: Confirm deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare API token missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Cloudflare account ID missing"; exit 1; }
      - name: Respect the recovery hold before every production mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
          RECOVERY_RELEASE: ${{ steps.mode.outputs.recovery_code_only }}
        run: node scripts/verify_release_hold.mjs
      - name: Verify code-only release prerequisites without database writes
        if: steps.mode.outputs.safe_code_only == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
          RECOVERY_RELEASE: ${{ steps.mode.outputs.recovery_code_only }}
        run: node scripts/verify_remediation_integrity_d1.mjs && node scripts/verify_recovery_ready.mjs
      - name: Apply only the additive CVIE migration
        if: steps.mode.outputs.maintenance != 'false'
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.156.0 d1 execute cveharbor-accounts --remote --file=migrations/0019_cvie.sql
          npx --yes wrangler@4.156.0 d1 execute cveharbor-accounts --remote --file=migrations/0020_cvie_evidence.sql
          npx --yes wrangler@4.156.0 d1 execute cveharbor-accounts --remote --file=migrations/0022_cvie_shared_scans.sql
      - name: Reuse existing public NVD history without deleting private caches
        if: steps.mode.outputs.maintenance != 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/bootstrap_cvie_shared.mjs
      - name: Require real D1 compatibility for CVIE queries before deployment
        if: steps.mode.outputs.maintenance != 'false'
        env:
          CVIE_SHARED_SCANS_ENABLED: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_cvie_d1.mjs
      - name: Verify installed software history setup without database writes
        if: steps.mode.outputs.inventory_only == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_software_history_d1.mjs
      - name: Verify catalogue scope with read-only D1 queries
        if: steps.mode.outputs.catalogue_only == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_catalogue_scope_d1.mjs
      - name: Guard the monitoring code-only release without schema or activation changes
        if: steps.mode.outputs.monitor_code_only == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_monitoring_inactive.mjs
      - name: Verify workspace queries with SELECT-only production probes
        if: steps.mode.outputs.workspace_only == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_workspace_d1.mjs
      - name: Record D1 recovery point and apply approved acknowledgement migration
        if: steps.mode.outputs.acknowledgement_release == 'true'
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.156.0 d1 time-travel info cveharbor-accounts --json
          npx --yes wrangler@4.156.0 d1 execute cveharbor-accounts --remote --file=migrations/0024_assignment_acknowledgements.sql
          node ../scripts/verify_assignment_ack_d1.mjs
      - name: Record D1 recovery point and apply assignment FYI migration
        if: steps.mode.outputs.fyi_release == 'true'
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.156.0 d1 time-travel info cveharbor-accounts --json
          npx --yes wrangler@4.156.0 d1 execute cveharbor-accounts --remote --file=migrations/0025_assignment_fyi.sql
          node ../scripts/verify_assignment_fyi_d1.mjs
      - name: Record recovery point and apply remediation workflow migration
        if: steps.mode.outputs.remediation_workflow == 'true'
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.156.0 d1 time-travel info cveharbor-accounts --json
          npx --yes wrangler@4.156.0 d1 execute cveharbor-accounts --remote --file=migrations/0026_remediation_workflow.sql
          node ../scripts/verify_remediation_workflow_d1.mjs
      - name: Record recovery point and apply assignment progress migration
        if: steps.mode.outputs.assignment_progress == 'true'
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.156.0 d1 time-travel info cveharbor-accounts --json
          npx --yes wrangler@4.156.0 d1 execute cveharbor-accounts --remote --file=migrations/0027_assignment_progress.sql
          node ../scripts/verify_assignment_progress_d1.mjs
      - name: Verify existing reviewer schema for notification code-only deployment
        if: steps.mode.outputs.assignment_progress_code_only == 'true' || inputs.assignment_release == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_assignment_progress_d1.mjs
      - name: Record recovery point and apply unified findings migration
        if: steps.mode.outputs.unified_findings == 'true'
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.156.0 d1 time-travel info cveharbor-accounts --json
          npx --yes wrangler@4.156.0 d1 execute cveharbor-accounts --remote --file=migrations/0028_unified_findings.sql
          node ../scripts/verify_unified_findings_d1.mjs
      - name: Record recovery point and apply assignment link migration
        if: steps.mode.outputs.finding_links == 'true'
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.156.0 d1 time-travel info cveharbor-accounts --json
          npx --yes wrangler@4.156.0 d1 execute cveharbor-accounts --remote --file=migrations/0029_finding_assignment_links.sql
          node ../scripts/verify_finding_links_d1.mjs
      - name: Record recovery point and apply status notification migration
        if: steps.mode.outputs.status_mail == 'true'
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.156.0 d1 time-travel info cveharbor-accounts --json
          npx --yes wrangler@4.156.0 d1 execute cveharbor-accounts --remote --file=migrations/0030_status_update_notifications.sql
          node ../scripts/verify_status_mail_d1.mjs
      - name: Verify existing link and status notification schemas before repair
        if: steps.mode.outputs.status_mail_repair == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_finding_links_d1.mjs && node scripts/verify_status_mail_d1.mjs
      - name: Audit existing remediation relationships and apply Phase 1 guards
        if: steps.mode.outputs.remediation_integrity == 'true'
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: |
          node ../scripts/verify_remediation_integrity_d1.mjs --preflight
          npx --yes wrangler@4.156.0 d1 time-travel info cveharbor-accounts --json
          npx --yes wrangler@4.156.0 d1 execute cveharbor-accounts --remote --file=migrations/0031_remediation_integrity.sql
          npx --yes wrangler@4.156.0 d1 execute cveharbor-accounts --remote --file=migrations/0032_recovery_control.sql
          node ../scripts/recovery_control.mjs install
          node ../scripts/verify_recovery_ready.mjs
          node ../scripts/verify_remediation_integrity_d1.mjs
      - name: Refresh guard coverage after explicitly requested maintenance
        if: steps.mode.outputs.maintenance == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/refresh_recovery_guards.mjs
      - name: Apply tested native migrations only on approved maintenance dispatch
        if: vars.SIMPLE_RELEASE_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.release_mode == 'cvie-maintenance'
        env:
          SIMPLE_RELEASE_ENABLED: ${{ vars.SIMPLE_RELEASE_ENABLED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/production_forward_migrations.mjs
      - name: Confirm the exact production predecessor for PR 287
        if: inputs.query_fix_287 == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_cvie_query_predecessor.mjs
      - name: Check candidate Worker against the live production database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
          RECOVERY_RELEASE: ${{ steps.mode.outputs.recovery_code_only }}
        run: node scripts/production_worker_preflight.mjs
      - name: Deploy Worker source
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.0 deploy --config wrangler.toml
      - name: Configure optional existing NVD key securely
        if: steps.mode.outputs.maintenance != 'false'
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          key=os.environ.get('NVD_API_KEY','')
          if key:
              result=subprocess.run(['npx','--yes','wrangler@4.156.0','secret','put','NVD_API_KEY'],input=key,text=True,capture_output=True)
              if result.returncode:raise SystemExit('Unable to configure the encrypted NVD runtime secret')
              print('Existing NVD key stored as an encrypted runtime secret')
          else:print('Using the anonymous NVD request budget; no new key is required')
          PY
      - name: Verify live accounts release and authentication boundary
        env:
          RECOVERY_RELEASE: ${{ steps.mode.outputs.recovery_code_only }}
        run: node scripts/production_service_health.mjs
      - name: Link any legacy products added during the deployment window
        if: steps.mode.outputs.maintenance != 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/bootstrap_cvie_shared.mjs
      - name: Refresh previously cached CVIE evidence once under the corrected Worker
        if: steps.mode.outputs.maintenance != 'false'
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.0 d1 execute cveharbor-accounts --remote --file=migrations/0021_cvie_audit_refresh.sql
      - name: Verify production API, CVIE tables and scheduled public-source collection
        if: steps.mode.outputs.maintenance != 'false'
        timeout-minutes: 17
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: python3 scripts/verify_cvie_production.py --wait-for-feeds 900
      - name: Confirm CVIE status and result queries on real production D1
        if: steps.mode.outputs.maintenance != 'false'
        env:
          CVIE_SHARED_SCANS_ENABLED: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_cvie_d1.mjs
      - name: Confirm software history schema and unauthenticated API boundary after inventory deployment
        if: steps.mode.outputs.inventory_only == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: |
          node scripts/verify_software_history_d1.mjs
          node --input-type=module -e "const r=await fetch('https://api.cveharbor.com/v1/inventory/software-history?customer_id=00000000-0000-4000-8000-000000000001');if(r.status!==401)throw Error('History endpoint must require authentication');console.log('PASS: unauthenticated history access rejected');"


      - name: Confirm deployed catalogue scope with read-only D1 queries
        if: steps.mode.outputs.catalogue_only == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_catalogue_scope_d1.mjs


      - name: Verify monitoring release preserved production schema, secrets, flags and schedules
        if: steps.mode.outputs.monitor_code_only == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_monitoring_inactive.mjs --after

      - name: Reconcile only the two owner-approved SMTP2GO tests
        if: steps.mode.outputs.monitor_code_only == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: python scripts/report_approved_monitor_tests.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.mode.outputs.monitor_code_only == 'true'
        with:
          name: approved-worker-monitor-tests
          path: work/approved-monitor-tests.json

      - name: Confirm workspace API authentication and read-only query compatibility
        if: steps.mode.outputs.workspace_only == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_workspace_d1.mjs --after

      - name: Confirm remediation API authentication after code-only deployment
        if: steps.mode.outputs.remediation_only == 'true'
        run: |
          node --input-type=module - <<'JS'
          const base='https://api.cveharbor.com/v1';
          const health=await fetch(base+'/health');
          if(!health.ok||(await health.json()).accounts!=='configured')throw Error('Account Worker health check failed');
          for(const path of ['/remediations','/remediations/features']){
            const response=await fetch(base+path);
            if(response.status!==401)throw Error('Private remediation endpoint must require authentication: '+path);
          }
          console.log('PASS: deployed Worker healthy; private remediation reads require authentication. No customer writes or email sends.');
          JS

      - name: Verify guest acknowledgement and private assignment boundaries without customer writes
        if: steps.mode.outputs.acknowledgement_release == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_assignment_ack_d1.mjs --after


name: Deploy Cloudflare Worker code after backend changes
on:
  push:
    branches: [main]
    paths:
      - 'release/**'
      - 'scripts/production_forward_migrations.mjs'
      - 'scripts/release_migrations.mjs'
      - 'scripts/production_release_checks.py'
      - 'account-backend/src/**'
      - 'data/lifecycle-products.json'
      - 'account-backend/tests/**'
      - 'account-backend/migrations/0019_cvie.sql'
      - 'account-backend/migrations/0020_cvie_evidence.sql'
      - 'account-backend/migrations/0021_cvie_audit_refresh.sql'
      - 'account-backend/migrations/0022_cvie_shared_scans.sql'
      - 'account-backend/wrangler.toml'
      - 'scripts/verify_cvie_production.py'
      - 'scripts/verify_cvie_d1.mjs'
      - 'scripts/bootstrap_cvie_shared.mjs'
      - 'scripts/cvie_rest_batch.mjs'
      - 'scripts/cvie_rest_batch.test.mjs'
      - 'scripts/worker_release_mode.mjs'
      - 'scripts/worker_release_smoke.mjs'
      - 'scripts/verify_software_history_d1.mjs'
      - 'scripts/verify_workspace_d1.mjs'
      - 'scripts/verify_assignment_ack_d1.mjs'
      - 'account-backend/migrations/0024_assignment_acknowledgements.sql'
      - 'account-backend/migrations/0025_assignment_fyi.sql'
      - 'account-backend/migrations/0026_remediation_workflow.sql'
      - 'scripts/verify_remediation_workflow_d1.mjs'
      - 'account-backend/migrations/0027_assignment_progress.sql'
      - 'account-backend/migrations/0028_unified_findings.sql'
      - 'scripts/verify_unified_findings_d1.mjs'
      - 'account-backend/migrations/0029_finding_assignment_links.sql'
      - 'scripts/verify_finding_links_d1.mjs'
      - 'account-backend/migrations/0030_status_update_notifications.sql'
      - 'scripts/verify_status_mail_d1.mjs'
      - 'account-backend/migrations/0031_remediation_integrity.sql'
      - 'account-backend/migrations/0032_recovery_control.sql'
      - 'scripts/recovery_control.mjs'
      - 'scripts/build_release_identity.mjs'
      - 'scripts/cloudflare_d1.mjs'
      - 'scripts/verify_remediation_integrity_d1.mjs'
      - 'scripts/verify_assignment_progress_d1.mjs'
      - 'scripts/verify_assignment_fyi_d1.mjs'
      - '.github/workflows/deploy-worker-code.yml'
  workflow_dispatch:
    inputs:
      team_release:
        description: Select the reviewed backend package
        type: choice
        options: [none, disabled, enabled, cvie-refresh, workspace-history, organization-ai, windows-inventory, dotnet-mapping, server-network, finding-ai, inventory-capacity, nvd-outage, dashboard-read-capacity, windows-agent]
        default: none
      team_commit:
        description: Exact reviewed main commit for Team & Access
        type: string
        required: false
      firewall_digest:
        description: Publish only confirmed firewall signup and daily delivery on the serving backend
        type: boolean
        default: false
      intelligence:
        description: Publish only the reviewed CVIE query repair and data reader
        type: boolean
        default: false
      manual_customer:
        description: Publish the manual customer assignment backend
        type: boolean
        default: false
      customer_reminders:
        description: Publish only customer and environment labels in reminder emails
        type: boolean
        default: false
      customer_investigation:
        description: Release only the reviewed customer investigation changes from PR 293
        type: boolean
        default: false
      assignment_release:
        description: Release only the staged reviewer email and reminder changes from PR 291
        type: boolean
        default: false
      query_fix_287:
        description: Release only the reviewed PR 287 backend after its verified staging run
        type: boolean
        default: false
      release_mode:
        description: 'Explicit release operation; code-only never runs migrations or maintenance'
        type: choice
        options: [code-only, recovery-code-only, phase1-integrity, cvie-maintenance]
        default: code-only
        required: true

permissions:
  contents: read

jobs:
  release-ready:
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify application and security checks for this production commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/production_release_checks.py
  deploy:
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: cveharbor-production-release
      cancel-in-progress: false
    needs: release-ready
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOYMENTS_ENABLED == 'true'
    name: Validate and deploy account Worker
    runs-on: ubuntu-latest
    environment: cloudflare-worker-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Require the native migration switch for an explicit maintenance release
        if: inputs.release_mode == 'cvie-maintenance'
        env:
          NATIVE_MIGRATIONS_ENABLED: ${{ vars.SIMPLE_RELEASE_ENABLED }}
        run: test "$NATIVE_MIGRATIONS_ENABLED" = true
      - name: Determine code-only release scope
        id: mode
        env:
          WORKER_RELEASE_MODE: ${{ inputs.release_mode || 'code-only' }}
        run: node scripts/worker_release_smoke.mjs && node scripts/worker_release_mode.mjs
      - name: Verify account backend
        working-directory: account-backend
        run: npm test && node ../scripts/cvie_rest_batch.test.mjs && node --check src/index.js && node --check src/plugin-advisories.js
      - name: Select and check the exact assignment Worker verified in staging
        if: inputs.assignment_release == true
        run: |
          python scripts/assignment_release.py backend release/.build/investigation-backend
          rsync --archive --delete release/.build/investigation-backend/account-backend/src/ account-backend/src/
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {backendIdentity} from './scripts/build_release_identity.mjs';
          import {verifyService} from './scripts/production_service_health.mjs';
          assert.equal(backendIdentity(),JSON.parse(fs.readFileSync('release/assignment-291.json')).backend_identity);
          await verifyService({expectedRelease:'738b07a3eee67dc5a3d872dfb4ccbbe5ba2aab628b8c964e820b7b69aea63ce8'});
          JS
          node --test account-backend/tests/assignment-*.test.mjs
      - name: Assemble the customer investigation backend on its verified production baseline
        if: inputs.customer_investigation == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${{ inputs.release_mode }}" = code-only
          test "${{ inputs.assignment_release }}" != true
          test "${{ inputs.query_fix_287 }}" != true
          python -c "import sys; sys.path.insert(0,'scripts'); import catalogue_promotion as p; p.evidence(293); p.ready('bbfb519b4dd69fc9599909151bb55f1807e0f9addac632ea782d5c55f2f0f524')"
          python scripts/customer_investigation_release.py backend release/.build/customer-investigation
          rsync --archive --delete release/.build/customer-investigation/account-backend/src/ account-backend/src/
          node --input-type=module -e "import {backendIdentity} from './scripts/build_release_identity.mjs'; import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.equal(backendIdentity(),fs.readFileSync('release/customer-investigation/backend-identity.txt','utf8').trim())"
          node --test account-backend/tests/customer-assignment-email.test.mjs
      - name: Assemble and verify the reminder-only production Worker
        if: inputs.customer_reminders == true
        env:
          MODE: ${{ inputs.release_mode }}
          OTHER_PACKAGE: ${{ inputs.customer_investigation || inputs.assignment_release || inputs.query_fix_287 }}
        run: |
          test "$MODE" = code-only
          test "$OTHER_PACKAGE" != true
          python -c "import sys; sys.path.insert(0,'scripts'); from customer_investigation_release import ready; ready()"
          python scripts/customer_investigation_release.py reminder-backend release/.build/customer-reminder
          rsync --archive --delete release/.build/customer-reminder/account-backend/src/ account-backend/src/
          node --test account-backend/tests/customer-assignment-email.test.mjs
      - name: Verify the isolated manual customer assignment release
        if: inputs.manual_customer == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
          MODE: ${{ inputs.release_mode }}
          OTHER_PACKAGE: ${{ inputs.customer_investigation || inputs.assignment_release || inputs.query_fix_287 || inputs.customer_reminders }}
        run: |
          test "$MODE" = code-only
          test "$OTHER_PACKAGE" != true
          node scripts/customer_scope_readiness.mjs
          python scripts/manual_customer_release.py backend release/.build/manual-investigation
          rsync --archive --delete release/.build/manual-investigation/account-backend/src/ account-backend/src/
          node --test account-backend/tests/customer-assignment-email.test.mjs
      - name: Assemble the production CVIE repair and verify the live catalogue query
        if: inputs.intelligence == true
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.release_mode }}
          OTHER_PACKAGE: ${{ inputs.manual_customer || inputs.customer_reminders || inputs.customer_investigation || inputs.assignment_release || inputs.query_fix_287 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
          CVIE_SHARED_SCANS_ENABLED: 'true'
        run: |
          test "$MODE" = code-only
          test "$OTHER_PACKAGE" != true
          python -c "import sys;sys.path.insert(0,'scripts'); import catalogue_promotion as p; p.evidence(301); p.ready('0846e72fae1637af3e62ae3939912bfb7d8a37c6d335d54505b745506de64822')"
          python scripts/intelligence_release.py backend release/.build/intelligence
          rsync --archive --delete release/.build/intelligence/account-backend/src/ account-backend/src/
          node scripts/verify_cvie_d1.mjs
      - name: Assemble the firewall subscription backend on its serving baseline
        if: inputs.firewall_digest == true
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.release_mode }}
          OTHER_PACKAGE: ${{ inputs.intelligence || inputs.manual_customer || inputs.customer_reminders || inputs.customer_investigation || inputs.assignment_release || inputs.query_fix_287 }}
        run: |
          test "$MODE" = code-only
          test "$OTHER_PACKAGE" != true
          python scripts/firewall_release.py backend release/.build/firewall
          rsync --archive --delete release/.build/firewall/account-backend/src/ account-backend/src/
          node --input-type=module -e "import {backendIdentity} from './scripts/build_release_identity.mjs'; import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.equal(backendIdentity(),fs.readFileSync('release/firewall-backend-identity.txt','utf8').trim())"
          node --test account-backend/tests/firewall-digest.test.mjs
      - name: Assemble the reviewed Team & Access backend
        if: inputs.team_release == 'enabled' || inputs.team_release == 'disabled' || inputs.team_release == 'cvie-refresh' || inputs.team_release == 'workspace-history' || inputs.team_release == 'organization-ai' || inputs.team_release == 'windows-inventory' || inputs.team_release == 'dotnet-mapping' || (inputs.team_release == 'server-network' || inputs.team_release == 'finding-ai' || inputs.team_release == 'inventory-capacity' || inputs.team_release == 'nvd-outage' || inputs.team_release == 'dashboard-read-capacity' || inputs.team_release == 'windows-agent')
        env:
          TEAM_STATE: ${{ inputs.team_release }}
          TEAM_COMMIT: ${{ inputs.team_commit }}
          MODE: ${{ inputs.release_mode }}
          OTHER_PACKAGE: ${{ inputs.firewall_digest || inputs.intelligence || inputs.manual_customer || inputs.customer_reminders || inputs.customer_investigation || inputs.assignment_release || inputs.query_fix_287 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$TEAM_COMMIT" = "$GITHUB_SHA"
          test "$MODE" = code-only
          test "$OTHER_PACKAGE" != true
          if [ "$TEAM_STATE" = windows-agent ]; then
            python -c "import sys;sys.path.insert(0,'scripts');import team_release as t;t.reviewed('feature/windows-agent')"
          elif [ "$TEAM_STATE" = dashboard-read-capacity ]; then
            python -c "import sys;sys.path.insert(0,'scripts');import team_release as t;t.reviewed('fix/snapshot-dashboard-responses')"
          elif [ "$TEAM_STATE" = nvd-outage ]; then
            python -c "import sys;sys.path.insert(0,'scripts');import team_release as t;t.reviewed('fix/nvd-outage-resilience')"
          elif [ "$TEAM_STATE" = inventory-capacity ]; then
            python -c "import sys;sys.path.insert(0,'scripts');import team_release as t;t.reviewed('release/backend-capacity')"
          elif [ "$TEAM_STATE" = finding-ai ]; then
            python -c "import sys;sys.path.insert(0,'scripts');import team_release as t;t.reviewed('feature/finding-ai-guidance')"
          elif [ "$TEAM_STATE" = server-network ]; then
            python -c "import sys;sys.path.insert(0,'scripts');import team_release as t;t.reviewed('feature/server-network-inventory')"
          elif [ "$TEAM_STATE" = dotnet-mapping ]; then
            python -c "import sys;sys.path.insert(0,'scripts');import team_release as t;t.reviewed('fix/dotnet-inventory-mapping')"
          elif [ "$TEAM_STATE" = windows-inventory ]; then
            python -c "import sys;sys.path.insert(0,'scripts');import team_release as t;t.reviewed('feature/windows-inventory-assessment')"
          elif [ "$TEAM_STATE" = organization-ai ]; then
            python -c "import sys;sys.path.insert(0,'scripts');import team_release as t;t.reviewed('feature/organization-ai-allowance')"
          elif [ "$TEAM_STATE" = workspace-history ]; then
            python -c "import sys;sys.path.insert(0,'scripts');import team_release as t;t.reviewed('feature/workspace-daily-history')"
          elif [ "$TEAM_STATE" = cvie-refresh ]; then
            python -c "import sys;sys.path.insert(0,'scripts');import team_release as t;t.reviewed('fix/cvie-refresh-read')"
          else
            python -c "import sys;sys.path.insert(0,'scripts');import team_release as t;t.reviewed()"
          fi
          python scripts/team_release.py "$TEAM_STATE" "$RUNNER_TEMP/team-worker"
          rsync --archive --delete "$RUNNER_TEMP/team-worker/account-backend/src/" account-backend/src/
          cp "$RUNNER_TEMP/team-worker/account-backend/wrangler.toml" account-backend/wrangler.toml
          node --input-type=module -e "import {backendIdentity} from './scripts/build_release_identity.mjs';import fs from 'node:fs';import assert from 'node:assert/strict';assert.equal(backendIdentity(),fs.readFileSync(process.env.TEAM_STATE==='windows-agent'?'release/windows-agent-backend.txt':process.env.TEAM_STATE==='dashboard-read-capacity'?'release/dashboard-read-capacity-backend.txt':process.env.TEAM_STATE==='nvd-outage'?'release/nvd-outage-backend.txt':process.env.TEAM_STATE==='inventory-capacity'?'release/inventory-capacity-backend.txt':process.env.TEAM_STATE==='finding-ai'?'release/finding-ai-backend.txt':process.env.TEAM_STATE==='server-network'?'release/server-network-backend.txt':process.env.TEAM_STATE==='dotnet-mapping'?'release/dotnet-mapping-backend.txt':process.env.TEAM_STATE==='windows-inventory'?'release/windows-inventory-backend.txt':process.env.TEAM_STATE==='organization-ai'?'release/organization-ai-backend.txt':process.env.TEAM_STATE==='workspace-history'?'release/workspace-history-backend.txt':process.env.TEAM_STATE==='cvie-refresh'?'release/cvie-refresh-backend.txt':'release/team-backend-'+process.env.TEAM_STATE+'.txt','utf8').trim())"
          if [ "$TEAM_STATE" = windows-agent ]; then node --test account-backend/tests/agents.test.mjs account-backend/tests/inventory-capacity.test.mjs account-backend/tests/workspace-history.test.mjs; fi
          if [ "$TEAM_STATE" = dashboard-read-capacity ]; then node --test account-backend/tests/versioned-read-cache.test.mjs account-backend/tests/dashboard-read-capacity.test.mjs account-backend/tests/inventory-capacity.test.mjs account-backend/tests/inventory-read-db.test.mjs account-backend/tests/recovery-control.test.mjs account-backend/tests/cvie-shared.test.mjs account-backend/tests/agents.test.mjs account-backend/tests/cvie-evidence.test.mjs account-backend/tests/cvie-audit.test.mjs; fi
          if [ "$TEAM_STATE" = nvd-outage ]; then node --test account-backend/tests/cvie.test.mjs account-backend/tests/cvie-evidence.test.mjs account-backend/tests/cvie-shared.test.mjs; fi
          if [ "$TEAM_STATE" = inventory-capacity ]; then node --test account-backend/tests/inventory-capacity.test.mjs account-backend/tests/inventory-read-db.test.mjs account-backend/tests/recovery-control.test.mjs account-backend/tests/inventory-history.test.mjs account-backend/tests/inventory-import.test.mjs; fi
          if [ "$TEAM_STATE" = finding-ai ]; then node --test account-backend/tests/ai-*.test.mjs account-backend/tests/personal-ai.test.mjs account-backend/tests/azure-connection.test.mjs; fi
          node --test account-backend/tests/team-access.test.mjs
          if [ "$TEAM_STATE" = server-network ]; then node --test account-backend/tests/server-network.test.mjs account-backend/tests/inventory-import.test.mjs account-backend/tests/ai-*.test.mjs; fi
          if [ "$TEAM_STATE" = dotnet-mapping ]; then node --test account-backend/tests/dotnet-inventory-mapping.test.mjs account-backend/tests/cvie.test.mjs account-backend/tests/cvie-dotnet.test.mjs account-backend/tests/cvie-evidence.test.mjs account-backend/tests/cvie-shared.test.mjs account-backend/tests/product-chooser.test.mjs account-backend/tests/inventory-import.test.mjs account-backend/tests/ai-*.test.mjs; fi
          if [ "$TEAM_STATE" = windows-inventory ]; then node --test account-backend/tests/inventory-import.test.mjs account-backend/tests/ai-*.test.mjs account-backend/tests/azure-connection.test.mjs; fi
          if [ "$TEAM_STATE" = organization-ai ]; then node --test account-backend/tests/ai-*.test.mjs account-backend/tests/azure-connection.test.mjs; fi
          if [ "$TEAM_STATE" = cvie-refresh ]; then node --test account-backend/tests/cvie-evidence.test.mjs account-backend/tests/cvie-shared.test.mjs; fi
          if [ "$TEAM_STATE" = workspace-history ]; then node --test account-backend/tests/azure-connection.test.mjs account-backend/tests/workspace-history.test.mjs account-backend/tests/workspace-summary.test.mjs account-backend/tests/cvie-evidence.test.mjs account-backend/tests/cvie-shared.test.mjs; fi
      - name: Verify the Team & Access predecessor and database
        if: inputs.team_release == 'enabled' || inputs.team_release == 'disabled' || inputs.team_release == 'cvie-refresh' || inputs.team_release == 'workspace-history' || inputs.team_release == 'organization-ai' || inputs.team_release == 'windows-inventory' || inputs.team_release == 'dotnet-mapping' || (inputs.team_release == 'server-network' || inputs.team_release == 'finding-ai' || inputs.team_release == 'inventory-capacity' || inputs.team_release == 'nvd-outage' || inputs.team_release == 'dashboard-read-capacity' || inputs.team_release == 'windows-agent')
        env:
          TEAM_STATE: ${{ inputs.team_release }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/team_release_check.mjs before
      - name: Confirm deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare API token missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Cloudflare account ID missing"; exit 1; }
      - name: Respect the recovery hold before every production mutation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
          RECOVERY_RELEASE: ${{ steps.mode.outputs.recovery_code_only }}
        run: node scripts/verify_release_hold.mjs
      - name: Verify code-only release prerequisites without database writes
        if: steps.mode.outputs.safe_code_only == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
          RECOVERY_RELEASE: ${{ steps.mode.outputs.recovery_code_only }}
        run: node scripts/verify_remediation_integrity_d1.mjs && node scripts/verify_recovery_ready.mjs
      - name: Apply only the additive CVIE migration
        if: steps.mode.outputs.maintenance != 'false'
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.156.0 d1 execute cveharbor-accounts --remote --file=migrations/0019_cvie.sql
          npx --yes wrangler@4.156.0 d1 execute cveharbor-accounts --remote --file=migrations/0020_cvie_evidence.sql
          npx --yes wrangler@4.156.0 d1 execute cveharbor-accounts --remote --file=migrations/0022_cvie_shared_scans.sql
      - name: Reuse existing public NVD history without deleting private caches
        if: steps.mode.outputs.maintenance != 'false'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/bootstrap_cvie_shared.mjs
      - name: Require real D1 compatibility for CVIE queries before deployment
        if: steps.mode.outputs.maintenance != 'false'
        env:
          CVIE_SHARED_SCANS_ENABLED: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_cvie_d1.mjs
      - name: Verify installed software history setup without database writes
        if: steps.mode.outputs.inventory_only == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_software_history_d1.mjs
      - name: Verify catalogue scope with read-only D1 queries
        if: steps.mode.outputs.catalogue_only == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_catalogue_scope_d1.mjs
      - name: Guard the monitoring code-only release without schema or activation changes
        if: steps.mode.outputs.monitor_code_only == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_monitoring_inactive.mjs
      - name: Verify workspace queries with SELECT-only production probes
        if: steps.mode.outputs.workspace_only == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_workspace_d1.mjs
      - name: Record D1 recovery point and apply approved acknowledgement migration
        if: steps.mode.outputs.acknowledgement_release == 'true'
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.156.0 d1 time-travel info cveharbor-accounts --json
          npx --yes wrangler@4.156.0 d1 execute cveharbor-accounts --remote --file=migrations/0024_assignment_acknowledgements.sql
          node ../scripts/verify_assignment_ack_d1.mjs
      - name: Record D1 recovery point and apply assignment FYI migration
        if: steps.mode.outputs.fyi_release == 'true'
        working-directory: account-backend
        env:

name: Deploy Cloudflare Worker code after backend changes
on:
  push:
    branches: [main]
    paths:
      - 'account-backend/src/**'
      - 'account-backend/tests/**'
      - 'account-backend/migrations/0019_cvie.sql'
      - 'account-backend/wrangler.toml'
      - '.github/workflows/deploy-worker-code.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cveharbor-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate CVIE, apply its additive tables and deploy Worker
    runs-on: ubuntu-latest
    environment: cloudflare-worker-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify account backend
        working-directory: account-backend
        run: npm test && node --check src/index.js && node --check src/plugin-advisories.js
      - name: Confirm deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Cloudflare API token missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Cloudflare account ID missing"; exit 1; }
      - name: Apply only the additive CVIE migration
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.0 d1 execute cveharbor-accounts --remote --file=migrations/0019_cvie.sql
      - name: Configure optional existing NVD key securely
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          key=os.environ.get('NVD_API_KEY','')
          if key:
              result=subprocess.run(['npx','--yes','wrangler@4.156.0','secret','put','NVD_API_KEY'],input=key,text=True,capture_output=True)
              if result.returncode:raise SystemExit('Unable to configure the encrypted NVD runtime secret')
              print('Existing NVD key stored as an encrypted runtime secret')
          else:print('Using the anonymous NVD request budget; no new key is required')
          PY
      - name: Deploy Worker source
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.156.0 deploy

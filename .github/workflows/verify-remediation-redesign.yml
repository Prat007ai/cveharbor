name: Verify Remediation redesign (no deployment)
on:
  push:
    branches: [feat/remediation-dashboard-redesign, feat/tracker-readability]
  pull_request:
    paths: ['index.html', 'remediation.css', 'operations.js', 'account-backend/src/remediation.js', 'account-backend/tests/remediation.test.mjs', 'scripts/remediation_*', 'scripts/customer_remediation*', 'customer-remediation-ui.js', 'account-backend/src/customer-remediation*.js', 'account-backend/tests/customer-remediation.test.mjs', 'deployment/proposals/customer-remediation/**', 'scripts/build_site.py', '.github/workflows/verify-remediation-redesign.yml']
permissions:
  contents: read
jobs:
  verify:
    name: verify-remediation-redesign / verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --no-package-lock jsdom@26 playwright-core@1.56.1
      - run: npm test --prefix account-backend
      - run: python -m unittest discover -s tests
      - run: python scripts/build_site.py
      - run: node scripts/customer_remediation_plan.mjs
      - run: node scripts/browser_smoke.mjs && node scripts/worker_release_smoke.mjs
      - run: node scripts/remediation_browser.mjs
      - run: node scripts/remediation_workflow_browser.mjs
      - run: node scripts/customer_remediation_browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: remediation-review-synthetic-data
          path: |
            work/remediation-review/
            work/workflow-review/

name: CVEHarbor setup and hourly sync

on:
  push:
    paths:
      - .github/workflows/bootstrap.yml
      - index.html
      - styles.css
      - app.js
      - data/demo-advisories.json
      - data/vendor-baseline.json
      - scripts/update.py
      - scripts/build_site.py
      - tests/test_update.py
  pull_request:
    paths:
      - .github/workflows/bootstrap.yml
      - index.html
      - styles.css
      - app.js
      - scripts/update.py
      - scripts/build_site.py
      - tests/test_update.py
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish the hourly advisory site now (enable Pages first)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cveharbor-site
  cancel-in-progress: false

jobs:
  verify:
    name: Test proposed website changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Validate JavaScript
        run: node --check app.js && node --check data.js
      - name: Verify public build
        run: python scripts/build_site.py

  restore:
    name: Restore site files
    if: github.event_name == 'workflow_dispatch' && inputs.deploy != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract site source without creating other workflow files
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import io
          import tarfile

          root = Path.cwd().resolve()
          data = base64.b64decode(Path('deployment/source.tar.xz.b64').read_text())
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:xz') as archive:
              safe_members = []
              for member in archive.getmembers():
                  path = Path(member.name)
                  target = (root / path).resolve()
                  if not target.is_relative_to(root):
                      raise ValueError('Unsafe archive path')
                  if not member.isfile() and not member.isdir():
                      raise ValueError('Unexpected archive member')
                  if path.parts and path.parts[0] == '.github':
                      print('Skipping bundled workflow:', member.name)
                      continue
                  safe_members.append(member)
              archive.extractall(root, members=safe_members, filter='data')
          print('Site source extracted successfully')
          PY
      - name: Commit website files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js data.js styles.css README.md CNAME robots.txt data scripts tests public
          if ! git diff --cached --quiet; then
            git commit -m 'Restore CVEHarbor website, data collector and tests'
            git push origin main
          fi

  sync:
    name: Collect public advisories and deploy
    if: (github.ref == 'refs/heads/main') && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate browser JavaScript
        run: node --check app.js && node --check data.js
      - name: Fetch advisories
        id: collect
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python scripts/update.py
      - name: Save public data safely if other commits arrived
        shell: bash
        run: |
          set -euo pipefail
          # Long feed collection can overlap changes to the website source.
          # Retain the generated data, sync to the latest main, and retry
          # optimistic pushes. Never force push or discard other changes.
          cp data/advisories.json "$RUNNER_TEMP/cveharbor-advisories.json"
          cp data/feed-health.json "$RUNNER_TEMP/cveharbor-health.json"
          cp data.js "$RUNNER_TEMP/cveharbor-data.js"
          git config user.name 'cveharbor-updater[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          success=false
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/cveharbor-advisories.json" data/advisories.json
            cp "$RUNNER_TEMP/cveharbor-health.json" data/feed-health.json
            cp "$RUNNER_TEMP/cveharbor-data.js" data.js
            git add data/advisories.json data/feed-health.json data.js
            if git diff --cached --quiet; then
              echo "Advisory data is already up to date."
              success=true
              break
            fi
            git commit -m 'Refresh CVEHarbor public advisories'
            if git push origin HEAD:main; then
              success=true
              break
            fi
            echo "Concurrent edit detected; retrying data-only commit (attempt $attempt)" >&2
            sleep $((attempt * 2))
          done
          if [ "$success" != true ]; then
            echo "Failed to publish advisory dataset after five safe retries." >&2
            exit 1
          fi
      - name: Build public site files
        run: python scripts/build_site.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Flag incomplete source collection
        if: always() && steps.collect.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('data/feed-health.json').read_text())
          if report.get('mode') != 'live':
              raise SystemExit('One or more vulnerability sources failed: ' + str(report.get('sources')))
          print('All configured vulnerability feeds responded during this collection.')
          PY
      - name: Flag failed source collection
        if: always() && steps.collect.outcome == 'failure'
        run: |
          echo 'Source collection failed; do not assume this dashboard is current.' >&2
          exit 1

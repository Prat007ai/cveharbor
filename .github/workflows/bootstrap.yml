name: CVEHarbor reviewed application publication

on:
  push:
    paths:
      - .github/workflows/bootstrap.yml
      - site-gate/**
      - cvie.js
      - cvie.css
      - scripts/cvie_browser_smoke.mjs
      - scripts/deploy_site_gate.py
      - scripts/disable_public_pages_origin.py
      - scripts/site_gate_client.py
      - tests/test_site_gate_deployment.py
      - index.html
      - styles.css
      - homepage.css
      - remediation.css
      - operations.js
      - assets/homepage/**
      - app.js
      - workspace.js
      - data/demo-advisories.json
      - data/vendor-baseline.json
      - scripts/update.py
      - scripts/build_site.py
      - scripts/verify_production.py
      - tests/test_update.py
      - account-backend/**
      - accounts.js
      - account-page.js
      - account-security.js
      - workspace-page.js
      - workspace-dashboard.js
      - website-monitor-page.js
      - website-monitor-dashboard.js
      - website-monitor/index.html
      - account-backend/src/website-monitor.js
      - customer-security.js
      - shared-remediation.js
      - shared-remediation.css
      - customer-dashboard/index.html
      - customer-reports/index.html
      - header-auth.js
      - page-router.js
      - account/index.html
      - workspace/index.html
      - disclosure-trend.js
      - data/lifecycle-products.json
      - lifecycle-directory-search.js
      - lifecycle-monitor.js
      - lifecycle-monitor.css
      - product-monitoring.js
      - scripts/product_monitoring_smoke.mjs
      - scripts/update_patch_notes.py
      - inventory.js
      - inventory-matching.js
      - scripts/browser_smoke.mjs
      - scripts/update_threats.py
      - threats.js
      - geo-map.js
      - malware.js
      - scripts/update_malware.py
      - malware-data.js
      - scripts/update_threats.py
  pull_request:
    paths:
      - scripts/catalogue_package.py
      - scripts/catalogue_promotion.py
      - .github/workflows/bootstrap.yml
      - site-gate/**
      - cvie.js
      - cvie.css
      - scripts/cvie_browser_smoke.mjs
      - scripts/deploy_site_gate.py
      - scripts/disable_public_pages_origin.py
      - scripts/site_gate_client.py
      - tests/test_site_gate_deployment.py
      - index.html
      - styles.css
      - homepage.css
      - remediation.css
      - operations.js
      - assets/homepage/**
      - app.js
      - scripts/update.py
      - scripts/build_site.py
      - scripts/verify_production.py
      - tests/test_update.py
      - scripts/browser_smoke.mjs
      - scripts/update_malware.py
      - malware.js
      - malware-data.js
      - account-backend/**
      - accounts.js
      - account-page.js
      - workspace-page.js
      - workspace-dashboard.js
      - website-monitor-page.js
      - website-monitor-dashboard.js
      - website-monitor/index.html
      - account-backend/src/website-monitor.js
      - customer-security.js
      - shared-remediation.js
      - shared-remediation.css
      - customer-dashboard/index.html
      - customer-reports/index.html
      - header-auth.js
      - page-router.js
      - account/index.html
      - workspace/index.html
      - disclosure-trend.js
      - data/lifecycle-products.json
      - lifecycle-directory-search.js
      - lifecycle-monitor.js
      - lifecycle-monitor.css
      - product-monitoring.js
      - scripts/product_monitoring_smoke.mjs
      - inventory.js
      - inventory-matching.js
  workflow_dispatch:
    inputs:
      catalogue_commit:
        description: 'Catalogue only (staging 42411365289). Enter the reviewed main SHA and leave general deploy off.'
        required: false
        type: string
      deploy:
        description: 'Publish approved application code now'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Test proposed website changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v && python -m py_compile scripts/update_malware.py && node --test site-gate/tests/*.test.mjs
      - name: Validate JavaScript
        run: node --check app.js && node --check data.js && node --check accounts.js && node --check account-page.js && node --check account-security.js && node --check workspace-page.js && node --check workspace-dashboard.js && node --check website-monitor-page.js && node --check website-monitor-dashboard.js && node --check account-backend/src/website-monitor.js && node --check account-backend/src/website-threat.js && node --check account-backend/src/web-risk-usage.js && node --check customer-security.js && node --check header-auth.js && node --check page-router.js && node --check operations.js && node --check disclosure-trend.js && node --check lifecycle-monitor.js && node --check product-monitoring.js && node --check inventory.js && node --check inventory-matching.js && node --check geo-map.js && node --check malware.js && node --check account-backend/src/index.js && node --check account-backend/src/digest.js && node --check account-backend/src/delivery.js && node --check account-backend/src/remediation.js && node --check account-backend/src/inventory.js && node --check account-backend/src/lifecycle.js
      - name: Test digest matching and email rendering
        run: cd account-backend && npm test
      - name: Verify public build
        run: python scripts/build_site.py && test -f public/disclosure-trend.js && test -f public/account/index.html && test -f public/workspace/index.html && test -f public/customer-dashboard/index.html && test -f public/customer-reports/index.html && test -f public/vulnerabilities/index.html && test -f public/malware/index.html && test -f public/lifecycle/index.html && test -f public/environments/index.html && test -f public/remediation/index.html
      - name: Validate generated pages before deployment
        run: python scripts/verify_production.py --preflight
      - name: Install DOM smoke test dependency
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Exercise site interactions
        run: node scripts/browser_smoke.mjs && node scripts/threat_health_smoke.mjs && node scripts/customer_security_smoke.mjs && node scripts/customer_score_smoke.mjs && node scripts/cvie_client_smoke.mjs && node scripts/cvie_polling_smoke.mjs && node scripts/product_monitoring_smoke.mjs

  catalogue-check:
    name: Verify catalogue scope and staging receipt
    if: (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/catalogue-') && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.catalogue_commit != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: read
      deployments: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify catalogue-only production package
        run: python scripts/catalogue_package.py "$RUNNER_TEMP/catalogue"
      - name: Verify signed-in staging acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/catalogue_promotion.py evidence
      - name: Check production environment before requesting deployment approval
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOGUE_COMMIT: ${{ inputs.catalogue_commit }}
          GENERAL_RELEASE: ${{ inputs.deploy }}
          GLOBAL_PUBLICATION: ${{ vars.PRODUCTION_DEPLOYMENTS_ENABLED }}
        run: |
          test "$CATALOGUE_COMMIT" = "$GITHUB_SHA"
          test "$GENERAL_RELEASE" = false
          test "$GLOBAL_PUBLICATION" != true
          test "$GITHUB_RUN_ATTEMPT" = 1
          python scripts/catalogue_promotion.py preflight

  catalogue-publish:
    name: Publish the reviewed catalogue to the production site
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.catalogue_commit == github.sha && inputs.deploy == false && github.run_attempt == 1 && vars.PRODUCTION_DEPLOYMENTS_ENABLED != 'true'
    needs: catalogue-check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: cveharbor-production-release
      cancel-in-progress: false
    environment: cloudflare-catalogue-42411365289
    permissions:
      contents: read
      actions: read
      issues: read
      deployments: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify catalogue-only production package
        run: python scripts/catalogue_package.py "$RUNNER_TEMP/catalogue"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install the pinned site publisher
        run: npm install --prefix "$RUNNER_TEMP/publisher" --no-audit --no-fund wrangler@4.156.0
      - name: Publish and verify the production catalogue
        env:
          GH_TOKEN: ${{ github.token }}
          WRANGLER: ${{ runner.temp }}/publisher/node_modules/.bin/wrangler
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_SITE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
          SITE_GATE_PASSWORD: ${{ secrets.CVEHARBOR_SITE_GATE_PASSWORD }}
        run: python scripts/catalogue_promotion.py publish "$RUNNER_TEMP/catalogue"

  restore:
    name: Prepare restoration artifact for a reviewed pull request
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy != true && !inputs.catalogue_commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Extract site source without creating other workflow files
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import io
          import tarfile

          root = Path.cwd().resolve()
          data = base64.b64decode(Path('deployment/source.tar.xz.b64').read_text())
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:xz') as archive:
              safe_members = []
              for member in archive.getmembers():
                  path = Path(member.name)
                  target = (root / path).resolve()
                  if not target.is_relative_to(root):
                      raise ValueError('Unsafe archive path')
                  if not member.isfile() and not member.isdir():
                      raise ValueError('Unexpected archive member')
                  if path.parts and path.parts[0] == '.github':
                      print('Skipping bundled workflow:', member.name)
                      continue
                  safe_members.append(member)
              archive.extractall(root, members=safe_members, filter='data')
          print('Site source extracted successfully')
          PY
      - name: Retain diagnostic evidence without repository writes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: restored-site-source-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            index.html
            app.js
            data.js
            styles.css
            README.md
            CNAME
            robots.txt
            data
            scripts
            tests
            public

  staging-ready:
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Require staging success for this exact commit before production approval
        env:
          SIMPLE_RELEASE_ENABLED: ${{ vars.SIMPLE_RELEASE_ENABLED }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/require_staging_release.mjs
      - name: Wait for matching backend before acquiring production publication lock
        run: node scripts/verify_frontend_backend.mjs --wait
  sync:
    concurrency:
      group: cveharbor-production-release
      cancel-in-progress: false
    needs: staging-ready
    name: Publish reviewed application code
    outputs:
      retire_pages_origin: ${{ steps.origin.outputs.retire_pages_origin }}
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOYMENTS_ENABLED == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true && !inputs.catalogue_commit))
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-site-production
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
    env:
      SITE_GATE_USERNAME: cveharbor
      SITE_GATE_PASSWORD: ${{ secrets.CVEHARBOR_SITE_GATE_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v && python -m py_compile scripts/update_malware.py && node --test site-gate/tests/*.test.mjs
      - name: Validate browser JavaScript
        run: node --check app.js && node --check data.js && node --check accounts.js && node --check account-page.js && node --check account-security.js && node --check workspace-page.js && node --check workspace-dashboard.js && node --check website-monitor-page.js && node --check website-monitor-dashboard.js && node --check account-backend/src/website-monitor.js && node --check account-backend/src/website-threat.js && node --check account-backend/src/web-risk-usage.js && node --check customer-security.js && node --check header-auth.js && node --check page-router.js && node --check operations.js && node --check disclosure-trend.js && node --check lifecycle-monitor.js && node --check product-monitoring.js && node --check inventory.js && node --check inventory-matching.js && node --check geo-map.js && node --check malware.js && node --check account-backend/src/index.js && node --check account-backend/src/digest.js && node --check account-backend/src/delivery.js && node --check account-backend/src/remediation.js && node --check account-backend/src/inventory.js && node --check account-backend/src/lifecycle.js
      - name: Test digest matching and email rendering
        run: cd account-backend && npm test
      - name: Install smoke test dependency
        if: github.event_name == 'push'
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Exercise site interactions
        if: github.event_name == 'push'
        run: node scripts/browser_smoke.mjs && node scripts/threat_health_smoke.mjs && node scripts/customer_security_smoke.mjs && node scripts/customer_score_smoke.mjs && node scripts/cvie_client_smoke.mjs && node scripts/cvie_polling_smoke.mjs && node scripts/product_monitoring_smoke.mjs
      - name: Build public site files
        run: python scripts/build_site.py && test -f public/disclosure-trend.js
      - name: Validate generated pages before deployment
        run: python scripts/verify_production.py --preflight
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Require matching backend and completed Phase 1 schema before code publication
        run: node scripts/verify_frontend_backend.mjs
      - name: Deploy protected frontend without changing the account API
        id: deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_SITE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: python scripts/deploy_site_gate.py
      - name: Verify authenticated production pages and published assets
        run: python scripts/verify_production.py
      - name: Close the old public Pages origin after protected-site verification
        id: origin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_PAGES_RETIREMENT_FALLBACK: 'true'
        run: python scripts/disable_public_pages_origin.py
      - name: Prepare notice for the former public origin
        if: steps.origin.outputs.retire_pages_origin == 'true'
        run: python scripts/build_retired_pages_origin.py
      - name: Upload only the retired-origin notice
        if: steps.origin.outputs.retire_pages_origin == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: retired-pages-origin

  retire-origin:
    permissions:
      pages: write
      id-token: write
    name: Replace the former public application with a retirement notice
    needs: sync
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOYMENTS_ENABLED == 'true' && needs.sync.outputs.retire_pages_origin == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: cveharbor-pages-retirement
      cancel-in-progress: false
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4


name: CVEHarbor setup and hourly sync

on:
  push:
    paths:
      - .github/workflows/bootstrap.yml
      - site-gate/**
      - cvie.js
      - cvie.css
      - scripts/cvie_browser_smoke.mjs
      - scripts/deploy_site_gate.py
      - scripts/disable_public_pages_origin.py
      - scripts/site_gate_client.py
      - tests/test_site_gate_deployment.py
      - index.html
      - styles.css
      - homepage.css
      - assets/homepage/**
      - app.js
      - workspace.js
      - data/demo-advisories.json
      - data/vendor-baseline.json
      - scripts/update.py
      - scripts/build_site.py
      - scripts/verify_production.py
      - tests/test_update.py
      - account-backend/**
      - accounts.js
      - account-page.js
      - account-security.js
      - workspace-page.js
      - workspace-dashboard.js
      - website-monitor-page.js
      - website-monitor-dashboard.js
      - website-monitor/index.html
      - account-backend/src/website-monitor.js
      - customer-security.js
      - customer-dashboard/index.html
      - customer-reports/index.html
      - header-auth.js
      - page-router.js
      - account/index.html
      - workspace/index.html
      - disclosure-trend.js
      - data/lifecycle-products.json
      - lifecycle-directory-search.js
      - lifecycle-monitor.js
      - lifecycle-monitor.css
      - product-monitoring.js
      - scripts/product_monitoring_smoke.mjs
      - scripts/update_patch_notes.py
      - inventory.js
      - inventory-matching.js
      - scripts/browser_smoke.mjs
      - scripts/update_threats.py
      - threats.js
      - geo-map.js
      - malware.js
      - scripts/update_malware.py
      - malware-data.js
      - scripts/update_threats.py
  pull_request:
    paths:
      - .github/workflows/bootstrap.yml
      - site-gate/**
      - cvie.js
      - cvie.css
      - scripts/cvie_browser_smoke.mjs
      - scripts/deploy_site_gate.py
      - scripts/disable_public_pages_origin.py
      - scripts/site_gate_client.py
      - tests/test_site_gate_deployment.py
      - index.html
      - styles.css
      - homepage.css
      - assets/homepage/**
      - app.js
      - scripts/update.py
      - scripts/build_site.py
      - scripts/verify_production.py
      - tests/test_update.py
      - scripts/browser_smoke.mjs
      - scripts/update_malware.py
      - malware.js
      - malware-data.js
      - account-backend/**
      - accounts.js
      - account-page.js
      - workspace-page.js
      - workspace-dashboard.js
      - website-monitor-page.js
      - website-monitor-dashboard.js
      - website-monitor/index.html
      - account-backend/src/website-monitor.js
      - customer-security.js
      - customer-dashboard/index.html
      - customer-reports/index.html
      - header-auth.js
      - page-router.js
      - account/index.html
      - workspace/index.html
      - disclosure-trend.js
      - data/lifecycle-products.json
      - lifecycle-directory-search.js
      - lifecycle-monitor.js
      - lifecycle-monitor.css
      - product-monitoring.js
      - scripts/product_monitoring_smoke.mjs
      - inventory.js
      - inventory-matching.js
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish the hourly advisory site now'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Allow PR validation while production collection is running, but serialize data publishers.
  group: cveharbor-${{ github.event_name == 'pull_request' && github.head_ref || 'site-production' }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test proposed website changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v && python -m py_compile scripts/update_malware.py && node --test site-gate/tests/*.test.mjs
      - name: Validate JavaScript
        run: node --check app.js && node --check data.js && node --check accounts.js && node --check account-page.js && node --check account-security.js && node --check workspace-page.js && node --check workspace-dashboard.js && node --check website-monitor-page.js && node --check website-monitor-dashboard.js && node --check account-backend/src/website-monitor.js && node --check account-backend/src/website-threat.js && node --check account-backend/src/web-risk-usage.js && node --check customer-security.js && node --check header-auth.js && node --check page-router.js && node --check operations.js && node --check disclosure-trend.js && node --check lifecycle-monitor.js && node --check product-monitoring.js && node --check inventory.js && node --check inventory-matching.js && node --check geo-map.js && node --check malware.js && node --check account-backend/src/index.js && node --check account-backend/src/digest.js && node --check account-backend/src/delivery.js && node --check account-backend/src/remediation.js && node --check account-backend/src/inventory.js && node --check account-backend/src/lifecycle.js
      - name: Test digest matching and email rendering
        run: cd account-backend && npm test
      - name: Verify public build
        run: python scripts/build_site.py && test -f public/disclosure-trend.js && test -f public/account/index.html && test -f public/workspace/index.html && test -f public/customer-dashboard/index.html && test -f public/customer-reports/index.html && test -f public/vulnerabilities/index.html && test -f public/malware/index.html && test -f public/lifecycle/index.html && test -f public/environments/index.html && test -f public/remediation/index.html
      - name: Validate generated pages before deployment
        run: python scripts/verify_production.py --preflight
      - name: Install DOM smoke test dependency
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Exercise site interactions
        run: node scripts/browser_smoke.mjs && node scripts/threat_health_smoke.mjs && node scripts/customer_security_smoke.mjs && node scripts/customer_score_smoke.mjs && node scripts/cvie_client_smoke.mjs && node scripts/cvie_polling_smoke.mjs && node scripts/product_monitoring_smoke.mjs

  restore:
    name: Restore site files
    if: github.event_name == 'workflow_dispatch' && inputs.deploy != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract site source without creating other workflow files
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import io
          import tarfile

          root = Path.cwd().resolve()
          data = base64.b64decode(Path('deployment/source.tar.xz.b64').read_text())
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:xz') as archive:
              safe_members = []
              for member in archive.getmembers():
                  path = Path(member.name)
                  target = (root / path).resolve()
                  if not target.is_relative_to(root):
                      raise ValueError('Unsafe archive path')
                  if not member.isfile() and not member.isdir():
                      raise ValueError('Unexpected archive member')
                  if path.parts and path.parts[0] == '.github':
                      print('Skipping bundled workflow:', member.name)
                      continue
                  safe_members.append(member)
              archive.extractall(root, members=safe_members, filter='data')
          print('Site source extracted successfully')
          PY
      - name: Commit website files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js data.js styles.css README.md CNAME robots.txt data scripts tests public
          if ! git diff --cached --quiet; then
            git commit -m 'Restore CVEHarbor website, data collector and tests'
            git push origin main
          fi

  sync:
    name: Collect public advisories and deploy
    outputs:
      retire_pages_origin: ${{ steps.origin.outputs.retire_pages_origin }}
    if: (github.ref == 'refs/heads/main') && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.deploy == true))
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-site-production
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_GATE_USERNAME: cveharbor
      SITE_GATE_PASSWORD: ${{ secrets.SITE_GATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v && python -m py_compile scripts/update_malware.py && node --test site-gate/tests/*.test.mjs
      - name: Validate browser JavaScript
        run: node --check app.js && node --check data.js && node --check accounts.js && node --check account-page.js && node --check account-security.js && node --check workspace-page.js && node --check workspace-dashboard.js && node --check website-monitor-page.js && node --check website-monitor-dashboard.js && node --check account-backend/src/website-monitor.js && node --check account-backend/src/website-threat.js && node --check account-backend/src/web-risk-usage.js && node --check customer-security.js && node --check header-auth.js && node --check page-router.js && node --check operations.js && node --check disclosure-trend.js && node --check lifecycle-monitor.js && node --check product-monitoring.js && node --check inventory.js && node --check inventory-matching.js && node --check geo-map.js && node --check malware.js && node --check account-backend/src/index.js && node --check account-backend/src/digest.js && node --check account-backend/src/delivery.js && node --check account-backend/src/remediation.js && node --check account-backend/src/inventory.js && node --check account-backend/src/lifecycle.js
      - name: Test digest matching and email rendering
        run: cd account-backend && npm test
      - name: Install smoke test dependency
        if: github.event_name == 'push'
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Exercise site interactions
        if: github.event_name == 'push'
        run: node scripts/browser_smoke.mjs && node scripts/threat_health_smoke.mjs && node scripts/customer_security_smoke.mjs && node scripts/customer_score_smoke.mjs && node scripts/cvie_client_smoke.mjs && node scripts/cvie_polling_smoke.mjs && node scripts/product_monitoring_smoke.mjs
      - name: Fetch advisories
        id: collect
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          WORDFENCE_API_KEY: ${{ secrets.WORDFENCE_API_KEY }}
        run: python scripts/update.py
      - name: Collect recent malware intelligence
        id: malware_collect
        continue-on-error: true
        env:
          MALWAREBAZAAR_API_KEY: ${{ secrets.MALWAREBAZAAR_API_KEY }}
        run: python scripts/update_malware.py
      - name: Collect public threat IP indicators
        id: threat_collect
        continue-on-error: true
        env:
          # Reuse the existing abuse.ch key unless a dedicated ThreatFox key is set.
          # Provider authorization is still checked by the ThreatFox response.
          THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY || secrets.MALWAREBAZAAR_API_KEY }}
        run: python scripts/update_threats.py
      - name: Save public data safely if other commits arrived
        shell: bash
        run: |
          set -euo pipefail
          # Long feed collection can overlap changes to the website source.
          # Retain the generated data, sync to the latest main, and retry
          # optimistic pushes. Never force push or discard other changes.
          cp data/advisories.json "$RUNNER_TEMP/cveharbor-advisories.json"
          cp data/feed-health.json "$RUNNER_TEMP/cveharbor-health.json"
          cp data.js "$RUNNER_TEMP/cveharbor-data.js"
          if [ -f malware-data.js ]; then cp malware-data.js "$RUNNER_TEMP/cveharbor-malware-data.js"; fi
          if [ -f threat-data.js ]; then cp threat-data.js "$RUNNER_TEMP/cveharbor-threat-data.js"; fi
          if [ -f data/threat-ip-history.json ]; then cp data/threat-ip-history.json "$RUNNER_TEMP/cveharbor-threat-history.json"; fi
          if [ -f data/ip-geolocation-cache.json ]; then cp data/ip-geolocation-cache.json "$RUNNER_TEMP/cveharbor-geo-cache.json"; fi
          for file in attack-scanning-current.txt attack-scanning-current.csv attack-scanning-current.json fortigate-threat-ip-objects.txt sophos-threat-ip-api.txt fortigate-suspicious-ip-initial.txt fortigate-suspicious-ip-incremental.txt sophos-suspicious-ip-initial.txt sophos-suspicious-ip-incremental.txt; do
            if [ -f "$file" ]; then cp "$file" "$RUNNER_TEMP/$file"; fi
          done
          git config user.name 'cveharbor-updater[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          success=false
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/cveharbor-advisories.json" data/advisories.json
            cp "$RUNNER_TEMP/cveharbor-health.json" data/feed-health.json
            cp "$RUNNER_TEMP/cveharbor-data.js" data.js
            if [ -f "$RUNNER_TEMP/cveharbor-malware-data.js" ]; then cp "$RUNNER_TEMP/cveharbor-malware-data.js" malware-data.js; fi
            if [ -f "$RUNNER_TEMP/cveharbor-threat-data.js" ]; then cp "$RUNNER_TEMP/cveharbor-threat-data.js" threat-data.js; fi
            if [ -f "$RUNNER_TEMP/cveharbor-threat-history.json" ]; then mkdir -p data; cp "$RUNNER_TEMP/cveharbor-threat-history.json" data/threat-ip-history.json; git add data/threat-ip-history.json; fi
            if [ -f "$RUNNER_TEMP/cveharbor-geo-cache.json" ]; then mkdir -p data; cp "$RUNNER_TEMP/cveharbor-geo-cache.json" data/ip-geolocation-cache.json; git add data/ip-geolocation-cache.json; fi
            for file in attack-scanning-current.txt attack-scanning-current.csv attack-scanning-current.json fortigate-threat-ip-objects.txt sophos-threat-ip-api.txt fortigate-suspicious-ip-initial.txt fortigate-suspicious-ip-incremental.txt sophos-suspicious-ip-initial.txt sophos-suspicious-ip-incremental.txt; do
              if [ -f "$RUNNER_TEMP/$file" ]; then cp "$RUNNER_TEMP/$file" "$file"; fi
            done
            git add data/advisories.json data/feed-health.json data.js malware-data.js
            if [ -f threat-data.js ]; then git add threat-data.js; fi
            for file in attack-scanning-current.txt attack-scanning-current.csv attack-scanning-current.json fortigate-threat-ip-objects.txt sophos-threat-ip-api.txt fortigate-suspicious-ip-initial.txt fortigate-suspicious-ip-incremental.txt sophos-suspicious-ip-initial.txt sophos-suspicious-ip-incremental.txt; do
              if [ -f "$file" ]; then git add "$file"; fi
            done
            if git diff --cached --quiet; then
              echo "Advisory data is already up to date."
              success=true
              break
            fi
            git commit -m 'Refresh CVEHarbor public advisories'
            if git push origin HEAD:main; then
              success=true
              break
            fi
            echo "Concurrent edit detected; retrying data-only commit (attempt $attempt)" >&2
            sleep $((attempt * 2))
          done
          if [ "$success" != true ]; then
            echo "Failed to publish advisory dataset after five safe retries." >&2
            exit 1
          fi
      - name: Collect public lifecycle dates
        continue-on-error: true
        run: python scripts/update_lifecycle.py
      - name: Collect publisher release and SQL CU notes
        continue-on-error: true
        run: python scripts/update_patch_notes.py
      - name: Build public site files
        run: python scripts/build_site.py && test -f public/disclosure-trend.js
      - name: Validate generated pages before deployment
        run: python scripts/verify_production.py --preflight
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy protected frontend without changing the account API
        id: deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: python scripts/deploy_site_gate.py
      - name: Verify authenticated production pages and published assets
        run: python scripts/verify_production.py
      - name: Independently inspect approved product monitoring without sending email
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/check_product_monitor_health.py
      - name: Close the old public Pages origin after protected-site verification
        id: origin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_PAGES_RETIREMENT_FALLBACK: 'true'
        run: python scripts/disable_public_pages_origin.py
      - name: Prepare notice for the former public origin
        if: steps.origin.outputs.retire_pages_origin == 'true'
        run: python scripts/build_retired_pages_origin.py
      - name: Upload only the retired-origin notice
        if: steps.origin.outputs.retire_pages_origin == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: retired-pages-origin
      - name: Flag incomplete source collection
        if: always() && steps.collect.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('data/feed-health.json').read_text())
          if report.get('mode') != 'live':
              raise SystemExit('One or more vulnerability sources failed: ' + str(report.get('sources')))
          print('All configured vulnerability feeds responded during this collection.')
          PY
      - name: Flag failed source collection
        if: always() && steps.collect.outcome == 'failure'
        run: |
          echo 'Source collection failed; do not assume this dashboard is current.' >&2
          exit 1

      - name: Flag incomplete threat IP collection
        if: always() && steps.threat_collect.outcome != 'skipped'
        env:
          THREAT_COLLECT_OUTCOME: ${{ steps.threat_collect.outcome }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          raw=Path('threat-data.js').read_text()
          report=json.loads(raw.split('=',1)[1].strip().removesuffix(';'))
          if os.environ.get('THREAT_COLLECT_OUTCOME') != 'success' or report.get('mode') != 'live':
              raise SystemExit('Threat IP collection degraded: ' + str(report.get('sources')))
          print('All configured threat feeds fetched successfully; unchanged counts can be legitimate.')
          PY

  retire-origin:
    name: Replace the former public application with a retirement notice
    needs: sync
    if: needs.sync.outputs.retire_pages_origin == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: cveharbor-pages-retirement
      cancel-in-progress: false
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4


name: Verify software history D1 setup without customer data
on:
  push:
    branches: [codex/software-upgrade-history]
    paths:
      - .github/workflows/verify-software-history.yml
      - scripts/verify_software_history_d1.mjs
      - account-backend/software-upgrade-history-schema.sql
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify history schema and reader with no database writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify_software_history_d1.mjs

name: Restore CVIE and Workspace availability
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/session-navigation.yml'
      - 'scripts/session_navigation_release.py'
      - 'app.js'
      - 'cvie.js'
      - 'header-auth.js'
      - 'account-page.js'
      - 'account-security.js'
      - 'workspace/index.html'
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: 'Exact reviewed main commit for CVIE and Workspace availability'
        required: true
        type: string
permissions:
  contents: read
jobs:
  check:
    name: Test CVIE and Workspace availability in the production package
    if: (github.event_name == 'pull_request' && github.head_ref == 'fix/cvie-availability' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.reviewed_commit != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      deployments: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the isolated production package
        run: python scripts/session_navigation_release.py prepare "$RUNNER_TEMP/catalogue"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check catalogue, account and workspace with fictional accounts
        env:
          CVEHARBOR_CHROMIUM_PATH: /usr/bin/google-chrome
          CVEHARBOR_PLAYWRIGHT_MODULE: ${{ github.workspace }}/staging/node_modules/playwright-core/index.mjs
        run: |
          npm install --prefix staging --ignore-scripts --no-package-lock
          CVEHARBOR_CATALOGUE_PUBLIC="$RUNNER_TEMP/catalogue/after" node scripts/catalogue_scope_browser_smoke.mjs
      - name: Check production environment before requesting deployment approval
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOGUE_COMMIT: ${{ inputs.reviewed_commit }}
          GLOBAL_PUBLICATION: ${{ vars.PRODUCTION_DEPLOYMENTS_ENABLED }}
        run: |
          test "$CATALOGUE_COMMIT" = "$GITHUB_SHA"
          test "$GLOBAL_PUBLICATION" != true
          test "$GITHUB_RUN_ATTEMPT" = 1
          python scripts/session_navigation_release.py preflight

  publish:
    name: Publish the CVIE and Workspace fix to production
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.reviewed_commit == github.sha && github.run_attempt == 1 && vars.PRODUCTION_DEPLOYMENTS_ENABLED != 'true'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: cveharbor-production-release
      cancel-in-progress: false
    environment: cloudflare-site-production
    permissions:
      contents: read
      actions: read
      pull-requests: read
      deployments: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the isolated production package
        run: python scripts/session_navigation_release.py prepare "$RUNNER_TEMP/catalogue"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install the pinned site publisher
        run: npm install --prefix "$RUNNER_TEMP/publisher" --no-audit --no-fund wrangler@4.156.0
      - name: Publish and verify the production session fix
        env:
          GH_TOKEN: ${{ github.token }}
          WRANGLER: ${{ runner.temp }}/publisher/node_modules/.bin/wrangler
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_SITE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
          SITE_GATE_PASSWORD: ${{ secrets.CVEHARBOR_SITE_GATE_PASSWORD }}
        run: python scripts/session_navigation_release.py publish "$RUNNER_TEMP/catalogue"

name: Publish reviewed production website
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/session-navigation.yml'
      - 'scripts/session_navigation_release.py'
      - 'scripts/customer_investigation_release.py'
      - 'scripts/manual_customer_release.py'
      - 'release/customer-investigation/**'
      - 'app.js'
      - 'cvie.js'
      - 'header-auth.js'
      - 'account-page.js'
      - 'account-security.js'
      - 'workspace/index.html'
      - 'workspace-dashboard.js'
      - 'workspace-dashboard.css'
      - 'scripts/workspace_overview_release.py'
      - 'scripts/workspace_history_site.py'
      - 'scripts/organization_ai_site.py'
      - 'scripts/windows_inventory_release.py'
      - 'scripts/server_security_release.py'
      - 'scripts/inventory_experience*'
      - 'scripts/inventory_actions*'
      - 'scripts/dashboard_responsiveness*'
      - 'scripts/finding_ai*'
      - 'finding-ai.*'
      - 'workspace-ai.js'
      - 'inventory-assessment.js'
      - 'inventory.js'
      - 'asset-import.js'
      - 'inventory-import.css'
      - 'styles.css'
      - 'scripts/server_security*'
      - 'server-security.*'
      - 'customer-security.js'
      - 'organization-security.js'
      - 'customer-dashboard/index.html'
      - 'collectors/**'
      - 'collector-app/**'
      - 'scripts/windows_collector_app_release.py'
      - 'ai-*.js'
      - 'ai-usage.css'
      - 'ai/**'
      - 'admin/ai-usage/**'
      - 'scripts/workspace_overview_browser.mjs'
      - 'scripts/workspace_fixture.mjs'
      - 'scripts/firewall_release.py'
      - 'scripts/installed_release.py'
      - 'scripts/team_release.py'
      - 'scripts/team_design_release.py'
      - 'team-*.js'
      - 'team-access.css'
      - 'account/index.html'
      - 'account-harbor.css'
      - 'assets/team-harbor/**'
      - 'scripts/team_access_browser.mjs'
      - 'scripts/sql_esu_release.py'
      - 'scripts/public_advisory_release.py'
      - 'site-gate/veeam-bulletins.mjs'
      - 'scripts/card_coverage_release.py'
      - 'scripts/card_coverage_browser.mjs'
      - 'site-gate/version-scan.mjs'
      - 'site-gate/vendor-scan.mjs'
      - 'site-gate/catalogue-history.mjs'
      - 'technology-version-picker.mjs'
  workflow_dispatch:
    inputs:
      site_release:
        description: Reviewed production package
        type: choice
        options: [followed-topics, assignment-291, customer-investigation, manual-customer, intelligence, version-picker, firewall-digest, installed-releases, team-access, sql-esu-coverage, card-source-coverage, team-harbor-design, public-advisory-scopes, account-harbor-views, account-responsive, workspace-overview, workspace-history, organization-ai, windows-inventory, server-security, server-network, inventory-experience, windows-collector-app, inventory-actions, dashboard-responsiveness, finding-ai]
        default: followed-topics
      feed_run_id:
        description: Data run containing the verified intelligence receipt (intelligence release only)
        type: string
        required: false
      reviewed_commit:
        description: 'Exact reviewed main commit for the CVIE topic release'
        required: true
        type: string
permissions:
  contents: read
jobs:
  collector-build:
    name: Build and test native Windows collector
    if: (github.event_name == 'pull_request' && github.head_ref == 'feature/windows-collector-app' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.site_release == 'windows-collector-app')
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build desktop application
        shell: powershell
        run: ./collector-app/build.ps1
      - name: Test exports with fictional Windows inventory
        shell: powershell
        run: ./collector-app/test.ps1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node collector-app/test-import.mjs verification
      - run: python collector-app/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-collector-package
          path: collector-app/package
          if-no-files-found: error
  check:
    env:
      FEED_RUN_ID: ${{ inputs.feed_run_id }}
      FEED_RECEIPT: ${{ github.workspace }}/.feed-receipt/feed-receipt.json
      CVEHARBOR_SITE_RELEASE: ${{ inputs.site_release || (github.head_ref == 'feature/finding-ai-guidance' && 'finding-ai') || (github.head_ref == 'fix/dashboard-responsiveness' && 'dashboard-responsiveness') || (github.head_ref == 'fix/inventory-action-response' && 'inventory-actions') || (github.head_ref == 'feature/windows-collector-app' && 'windows-collector-app') || (github.head_ref == 'feature/inventory-upload-experience' && 'inventory-experience') || (github.head_ref == 'feature/server-network-inventory' && 'server-network') || (github.head_ref == 'feature/server-security-dashboard' && 'server-security') || (github.head_ref == 'feature/windows-inventory-assessment' && 'windows-inventory') || (github.head_ref == 'feature/organization-ai-allowance' && 'organization-ai') || (github.head_ref == 'feature/workspace-daily-history' && 'workspace-history') || (github.head_ref == 'feature/workspace-dark-redesign' && 'workspace-overview') || (github.head_ref == 'fix/account-responsive' && 'account-responsive') || (github.head_ref == 'feature/account-harbor-views' && 'account-harbor-views') || (github.head_ref == 'fix/public-advisory-scopes' && 'public-advisory-scopes') || (github.head_ref == 'feature/team-harbor-design' && 'team-harbor-design') || (github.head_ref == 'fix/card-source-coverage' && 'card-source-coverage') || (github.head_ref == 'fix/sql-esu-release-baseline' && 'sql-esu-coverage') || (github.head_ref == 'release/organization-team-access' && 'team-access') || (github.head_ref == 'fix/vendor-zero-scan-audit' && 'installed-releases') || (github.head_ref == 'feat/daily-firewall-digest' && 'firewall-digest') || (github.head_ref == 'fix/version-picker-cloudflare' && 'version-picker') || (github.head_ref == 'feature/assignment-manual-customer' && 'manual-customer') || (github.head_ref == 'feature/customer-advisory-review' && 'customer-investigation') || 'followed-topics' }}
    name: Test followed topics in the production package
    needs: collector-build
    if: always() && (needs.collector-build.result == 'success' || needs.collector-build.result == 'skipped') && ((github.event_name == 'pull_request' && (github.head_ref == 'feature/finding-ai-guidance' || github.head_ref == 'fix/dashboard-responsiveness' || github.head_ref == 'fix/inventory-action-response' || github.head_ref == 'feature/windows-collector-app' || github.head_ref == 'feature/inventory-upload-experience' || github.head_ref == 'feature/server-network-inventory' || github.head_ref == 'feature/server-security-dashboard' || github.head_ref == 'feature/windows-inventory-assessment' || github.head_ref == 'feature/organization-ai-allowance' || github.head_ref == 'feature/workspace-daily-history' || github.head_ref == 'feature/workspace-dark-redesign' || github.head_ref == 'fix/account-responsive' || github.head_ref == 'feature/account-harbor-views' || github.head_ref == 'fix/public-advisory-scopes' || github.head_ref == 'feature/team-harbor-design' || github.head_ref == 'fix/card-source-coverage' || github.head_ref == 'fix/sql-esu-release-baseline' || github.head_ref == 'release/organization-team-access' || github.head_ref == 'fix/vendor-zero-scan-audit' || github.head_ref == 'feat/daily-firewall-digest' || github.head_ref == 'fix/version-picker-cloudflare' || github.head_ref == 'feature/cvie-topic-delivery' || github.head_ref == 'feature/customer-advisory-review' || github.head_ref == 'feature/assignment-manual-customer') && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.reviewed_commit != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      deployments: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Read the public data receipt from the selected data run
        if: inputs.site_release == 'intelligence'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: feed-receipt
          path: .feed-receipt
          run-id: ${{ inputs.feed_run_id }}
          github-token: ${{ github.token }}
      - name: Download this run's tested Windows collector
        if: env.CVEHARBOR_SITE_RELEASE == 'windows-collector-app'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-collector-package
          path: collector-app/package
      - name: Download the unchanged published PR348 collector
        if: (env.CVEHARBOR_SITE_RELEASE == 'inventory-actions' || env.CVEHARBOR_SITE_RELEASE == 'dashboard-responsiveness' || env.CVEHARBOR_SITE_RELEASE == 'finding-ai')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-collector-package
          path: collector-app/package
          run-id: 43264633230
          github-token: ${{ github.token }}
      - name: Verify the isolated production package
        run: python scripts/session_navigation_release.py prepare "$RUNNER_TEMP/catalogue"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check catalogue, account and workspace with fictional accounts
        env:
          CVEHARBOR_CHROMIUM_PATH: /usr/bin/google-chrome
          CVEHARBOR_PLAYWRIGHT_MODULE: ${{ github.workspace }}/staging/node_modules/playwright-core/index.mjs
        run: |
          npm install --prefix staging --ignore-scripts --no-package-lock
          export CVEHARBOR_CATALOGUE_PUBLIC="$RUNNER_TEMP/catalogue/after"
          if [ "$CVEHARBOR_SITE_RELEASE" = card-source-coverage ] || [ "$CVEHARBOR_SITE_RELEASE" = public-advisory-scopes ]; then
            node --test site-gate/tests/version-picker.test.mjs
            node scripts/card_coverage_browser.mjs
            python -m unittest discover -s scripts -p test_monitor_version_scans.py
          fi
          if [ "$CVEHARBOR_SITE_RELEASE" = workspace-overview ] || [ "$CVEHARBOR_SITE_RELEASE" = workspace-history ] || [ "$CVEHARBOR_SITE_RELEASE" = team-access ] || [ "$CVEHARBOR_SITE_RELEASE" = team-harbor-design ] || [ "$CVEHARBOR_SITE_RELEASE" = account-harbor-views ] || [ "$CVEHARBOR_SITE_RELEASE" = account-responsive ]; then
            python scripts/team_release.py enabled "$RUNNER_TEMP/team-worker"
            TEAM_TEST_SITE="$RUNNER_TEMP/catalogue/after" TEAM_TEST_WORKER="$RUNNER_TEMP/team-worker/account-backend/src/index.js" TEAM_TEST_CHROME=/usr/bin/google-chrome node scripts/team_access_browser.mjs
          fi
          if [ "$CVEHARBOR_SITE_RELEASE" = account-responsive ]; then
            VERIFIED_SITE="$RUNNER_TEMP/catalogue/after" TEAM_TEST_SCREENSHOTS="$RUNNER_TEMP/responsive-check" TEAM_TEST_CHROME=/usr/bin/google-chrome node scripts/account_harbor_live.mjs
          fi
          if [ "$CVEHARBOR_SITE_RELEASE" = workspace-overview ] || [ "$CVEHARBOR_SITE_RELEASE" = workspace-history ]; then
            WORKSPACE_SITE="$RUNNER_TEMP/catalogue/after" WORKSPACE_BEFORE="$RUNNER_TEMP/catalogue/before" WORKSPACE_SCREENSHOTS="$RUNNER_TEMP/workspace-screens" node scripts/workspace_overview_browser.mjs
          fi
          if [ "$CVEHARBOR_SITE_RELEASE" = server-security ] || [ "$CVEHARBOR_SITE_RELEASE" = server-network ]; then SERVER_TEST_SITE="$RUNNER_TEMP/catalogue/after" SERVER_SCREENSHOTS="$RUNNER_TEMP/server-screens" node scripts/server_security_browser.mjs; fi
          if [ "$CVEHARBOR_SITE_RELEASE" = inventory-actions ] || [ "$CVEHARBOR_SITE_RELEASE" = dashboard-responsiveness ] || [ "$CVEHARBOR_SITE_RELEASE" = finding-ai ] || [ "$CVEHARBOR_SITE_RELEASE" = inventory-experience ] || [ "$CVEHARBOR_SITE_RELEASE" = windows-collector-app ]; then
            INVENTORY_TEST_SITE="$RUNNER_TEMP/catalogue/after" INVENTORY_SCREENSHOTS="$RUNNER_TEMP/inventory-screens" node scripts/inventory_browser.mjs
            INVENTORY_TEST_SITE="$RUNNER_TEMP/catalogue/after" INVENTORY_SCREENSHOTS="$RUNNER_TEMP/inventory-screens" node scripts/inventory_experience_browser.mjs
          fi
          if [ "$CVEHARBOR_SITE_RELEASE" = inventory-actions ] || [ "$CVEHARBOR_SITE_RELEASE" = dashboard-responsiveness ] || [ "$CVEHARBOR_SITE_RELEASE" = finding-ai ]; then INVENTORY_TEST_SITE="$RUNNER_TEMP/catalogue/after" INVENTORY_SCREENSHOTS="$RUNNER_TEMP/inventory-screens" node scripts/inventory_actions_browser.mjs; fi
          if [ "$CVEHARBOR_SITE_RELEASE" = dashboard-responsiveness ] || [ "$CVEHARBOR_SITE_RELEASE" = finding-ai ]; then INVENTORY_TEST_SITE="$RUNNER_TEMP/catalogue/after" INVENTORY_SCREENSHOTS="$RUNNER_TEMP/inventory-screens" node scripts/dashboard_responsiveness_browser.mjs; fi
          if [ "$CVEHARBOR_SITE_RELEASE" = windows-inventory ]; then INVENTORY_TEST_SITE="$RUNNER_TEMP/catalogue/after" INVENTORY_SCREENSHOTS="$RUNNER_TEMP/inventory-screens" node scripts/inventory_browser.mjs; fi
          if [ "$CVEHARBOR_SITE_RELEASE" = organization-ai ]; then AI_TEST_SITE="$RUNNER_TEMP/catalogue/after" node scripts/ai_usage_browser.mjs; fi
          if [ "$CVEHARBOR_SITE_RELEASE" = finding-ai ]; then INVENTORY_TEST_SITE="$RUNNER_TEMP/catalogue/after" INVENTORY_SCREENSHOTS="$RUNNER_TEMP/inventory-screens" node scripts/finding_ai_browser.mjs; FINDING_AI_TEST=true AI_TEST_SITE="${INVENTORY_TEST_SITE:-$RUNNER_TEMP/catalogue/after}" node scripts/ai_usage_browser.mjs; fi
          node scripts/catalogue_scope_browser_smoke.mjs
          if [ "$CVEHARBOR_SITE_RELEASE" != "followed-topics" ]; then node scripts/remediation_workflow_browser.mjs; fi
      - name: Require production application and security tests for the team design
        if: github.event_name == 'workflow_dispatch' && (((inputs.site_release == 'inventory-actions' || inputs.site_release == 'dashboard-responsiveness' || inputs.site_release == 'finding-ai') || inputs.site_release == 'windows-collector-app' || inputs.site_release == 'inventory-experience' || inputs.site_release == 'server-security' || inputs.site_release == 'server-network' || inputs.site_release == 'windows-inventory' || inputs.site_release == 'workspace-overview' || inputs.site_release == 'workspace-history' || inputs.site_release == 'organization-ai') || inputs.site_release == 'team-harbor-design' || (inputs.site_release == 'account-harbor-views' || inputs.site_release == 'account-responsive'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/production_release_checks.py
      - name: Check production environment before requesting deployment approval
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          CATALOGUE_COMMIT: ${{ inputs.reviewed_commit }}
          GLOBAL_PUBLICATION: ${{ vars.PRODUCTION_DEPLOYMENTS_ENABLED }}
        run: |
          test "$CATALOGUE_COMMIT" = "$GITHUB_SHA"
          test "$GLOBAL_PUBLICATION" != true
          test "$GITHUB_RUN_ATTEMPT" = 1
          python scripts/session_navigation_release.py preflight

      - name: Save fictional Workspace comparison screenshots
        if: (env.CVEHARBOR_SITE_RELEASE == 'workspace-overview' || env.CVEHARBOR_SITE_RELEASE == 'workspace-history')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workspace-review-screens
          path: ${{ runner.temp }}/workspace-screens
          if-no-files-found: error

  publish:
    env:
      FEED_RUN_ID: ${{ inputs.feed_run_id }}
      FEED_RECEIPT: ${{ github.workspace }}/.feed-receipt/feed-receipt.json
      CVEHARBOR_SITE_RELEASE: ${{ inputs.site_release }}
    name: Publish reviewed website to production
    if: always() && !cancelled() && needs.check.result == 'success' && github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.reviewed_commit == github.sha && github.run_attempt == 1 && vars.PRODUCTION_DEPLOYMENTS_ENABLED != 'true'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: cveharbor-production-release
      cancel-in-progress: false
    environment: cloudflare-site-production
    permissions:
      contents: read
      actions: read
      pull-requests: read
      deployments: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Read the public data receipt from the selected data run
        if: inputs.site_release == 'intelligence'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: feed-receipt
          path: .feed-receipt
          run-id: ${{ inputs.feed_run_id }}
          github-token: ${{ github.token }}
      - name: Download this run's tested Windows collector
        if: env.CVEHARBOR_SITE_RELEASE == 'windows-collector-app'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-collector-package
          path: collector-app/package
      - name: Download the unchanged published PR348 collector
        if: (env.CVEHARBOR_SITE_RELEASE == 'inventory-actions' || env.CVEHARBOR_SITE_RELEASE == 'dashboard-responsiveness' || env.CVEHARBOR_SITE_RELEASE == 'finding-ai')
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-collector-package
          path: collector-app/package
          run-id: 43264633230
          github-token: ${{ github.token }}
      - name: Verify the isolated production package
        run: python scripts/session_navigation_release.py prepare "$RUNNER_TEMP/catalogue"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install the pinned site publisher
        run: npm install --prefix "$RUNNER_TEMP/publisher" --no-audit --no-fund wrangler@4.156.0
      - name: Publish and verify the production session fix
        env:
          GH_TOKEN: ${{ github.token }}
          WRANGLER: ${{ runner.temp }}/publisher/node_modules/.bin/wrangler
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_SITE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
          SITE_GATE_PASSWORD: ${{ secrets.CVEHARBOR_SITE_GATE_PASSWORD }}
        run: python scripts/session_navigation_release.py publish "$RUNNER_TEMP/catalogue"
      - name: Install the browser used to verify the account views
        if: (inputs.site_release == 'account-harbor-views' || inputs.site_release == 'account-responsive')
        run: npm install --prefix staging --ignore-scripts --no-package-lock
      - name: View the three live account screens with fictional identities
        if: (inputs.site_release == 'account-harbor-views' || inputs.site_release == 'account-responsive')
        env:
          VERIFIED_SITE: ${{ runner.temp }}/catalogue/verified-origin
          TEAM_TEST_CHROME: /usr/bin/google-chrome
          TEAM_TEST_SCREENSHOTS: ${{ runner.temp }}/account-screens
        run: node scripts/account_harbor_live.mjs
      - name: Save production screenshots
        if: (inputs.site_release == 'account-harbor-views' || inputs.site_release == 'account-responsive')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: account-production-screens
          path: ${{ runner.temp }}/account-screens/*.png
          if-no-files-found: error

      - name: Verify the live Workspace assets with fictional records
        if: (inputs.site_release == 'workspace-overview' || inputs.site_release == 'workspace-history' || inputs.site_release == 'organization-ai')
        env:
          CVEHARBOR_CHROMIUM_PATH: /usr/bin/google-chrome
          CVEHARBOR_PLAYWRIGHT_MODULE: ${{ github.workspace }}/staging/node_modules/playwright-core/index.mjs
          WORKSPACE_SITE: ${{ runner.temp }}/catalogue/verified-origin
          WORKSPACE_SCREENSHOTS: ${{ runner.temp }}/workspace-live-screens
        run: |
          npm install --prefix staging --ignore-scripts --no-package-lock
          node scripts/workspace_overview_browser.mjs
      - name: Save fictional Workspace production screenshots
        if: (inputs.site_release == 'workspace-overview' || inputs.site_release == 'workspace-history' || inputs.site_release == 'organization-ai')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: workspace-production-screens
          path: ${{ runner.temp }}/workspace-live-screens
          if-no-files-found: error

      - name: Check served AI assets with fictional accounts
        if: inputs.site_release == 'organization-ai'
        env:
          AI_TEST_SITE: ${{ runner.temp }}/catalogue/verified-origin
          CVEHARBOR_CHROMIUM_PATH: /usr/bin/google-chrome
          AI_TEST_SCREENSHOTS: ${{ runner.temp }}/ai-screens
        run: |
          npm install --prefix staging --ignore-scripts --no-package-lock
          node scripts/ai_usage_browser.mjs

      - name: Check served inventory workflow with fictional data
        if: inputs.site_release == 'windows-inventory'
        env:
          INVENTORY_TEST_SITE: ${{ runner.temp }}/catalogue/verified-origin
          INVENTORY_SCREENSHOTS: ${{ runner.temp }}/inventory-live-screens
        run: |
          npm install --prefix staging --ignore-scripts --no-package-lock
          node scripts/inventory_browser.mjs

      - name: Check served server dashboard with fictional accounts
        if: inputs.site_release == 'server-security' || inputs.site_release == 'server-network'
        env:
          SERVER_TEST_SITE: ${{ runner.temp }}/catalogue/verified-origin
          SERVER_SCREENSHOTS: ${{ runner.temp }}/server-live-screens
        run: |
          npm install --prefix staging --ignore-scripts --no-package-lock
          node scripts/server_security_browser.mjs

      - name: Verify served inventory experience with fictional accounts
        if: (inputs.site_release == 'inventory-actions' || inputs.site_release == 'dashboard-responsiveness' || inputs.site_release == 'finding-ai') || inputs.site_release == 'inventory-experience' || inputs.site_release == 'windows-collector-app'
        env:
          INVENTORY_TEST_SITE: ${{ runner.temp }}/catalogue/verified-origin
          INVENTORY_SCREENSHOTS: ${{ runner.temp }}/inventory-live-screens
        run: |
          npm install --prefix staging --ignore-scripts --no-package-lock
          node scripts/inventory_browser.mjs
          node scripts/inventory_experience_browser.mjs
          if [ "$CVEHARBOR_SITE_RELEASE" = inventory-actions ] || [ "$CVEHARBOR_SITE_RELEASE" = dashboard-responsiveness ] || [ "$CVEHARBOR_SITE_RELEASE" = finding-ai ]; then node scripts/inventory_actions_browser.mjs; fi
          if [ "$CVEHARBOR_SITE_RELEASE" = dashboard-responsiveness ] || [ "$CVEHARBOR_SITE_RELEASE" = finding-ai ]; then node scripts/dashboard_responsiveness_browser.mjs; fi
          if [ "$CVEHARBOR_SITE_RELEASE" = finding-ai ]; then node scripts/finding_ai_browser.mjs; FINDING_AI_TEST=true AI_TEST_SITE="${INVENTORY_TEST_SITE:-$RUNNER_TEMP/catalogue/after}" node scripts/ai_usage_browser.mjs; fi
      - name: Save inventory production screenshots
        if: (inputs.site_release == 'inventory-actions' || inputs.site_release == 'dashboard-responsiveness' || inputs.site_release == 'finding-ai') || inputs.site_release == 'inventory-experience' || inputs.site_release == 'windows-collector-app'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: inventory-production-screens
          path: ${{ runner.temp }}/inventory-live-screens
          if-no-files-found: error

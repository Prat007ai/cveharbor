name: Verify CVIE development branch without deployment
on:
  workflow_dispatch:
  push:
    branches: [feat/cvie-product-intelligence, fix/cvie-reliability-audit]
    paths: ['account-backend/**','cvie.js','cvie.css','app.js','inventory*.js','customer-security.js','index.html','scripts/**','.github/workflows/verify-cvie.yml']
permissions:
  contents: read
concurrency:
  group: cvie-development-verification
  cancel-in-progress: false
jobs:
  verify:
    name: verify-cvie / verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test persistent CVIE scans and existing account behavior
        working-directory: account-backend
        run: npm test && node tests/cvie-audit.test.mjs
      - name: Build and verify website
        run: python scripts/build_site.py && python scripts/verify_production.py --preflight
      - name: Run existing data and browser interaction checks
        run: |
          python -m unittest discover -s tests
          npm install --no-save --no-package-lock jsdom@26
          node scripts/browser_smoke.mjs
          node scripts/customer_security_smoke.mjs
          node scripts/customer_score_smoke.mjs
          node scripts/threat_health_smoke.mjs
          node scripts/cvie_client_smoke.mjs
      - name: Verify NVD, original CVE disclosures and CISA KEV in a disposable database
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: node scripts/probe_cvie_live.mjs
      - name: Verify real product families with NVD
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: node scripts/probe_cvie_products.mjs
      - name: Require a successful live provider check
        run: python -c "import json; assert all(json.load(open('data/'+name+'.json'))['ok'] for name in ['cvie-provider-check','cvie-product-check']), 'A live CVIE check failed; inspect the recorded evidence'"
      - name: Retain diagnostic evidence without repository writes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-cvie-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            data/cvie-*-check.json

  production-readonly:
    name: verify-cvie production metadata
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: cloudflare-production-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Inspect production public-source health without changing data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_AUDIT_ACCOUNT_ID }}
        run: python scripts/probe_cvie_runtime.py
      - name: Retain diagnostic evidence without repository writes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-cvie-production-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            data/cvie-*-runtime-check.json
            data/cvie-runtime-check.json

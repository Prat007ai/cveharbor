name: Verify assignment email and acknowledgement (no deployment)
on:
  push:
    branches: [feat/assignment-acknowledgement, feat/assignment-fyi, feat/remediation-workflow-polish, feat/assignment-progress-reminders, feat/manager-inactivity-notices]
  pull_request:
    paths: ['account-backend/tests/status-mail-repair.test.mjs', 'scripts/status_mail_repair_browser.mjs', 'account-backend/src/status-update-mail.js', 'account-backend/tests/status-update-mail.test.mjs', 'account-backend/migrations/0030_status_update_notifications.sql', 'scripts/status_mail_browser.mjs', 'scripts/verify_status_mail_d1.mjs', 'account-backend/src/finding-assignment-links.js', 'account-backend/tests/finding-assignment-links.test.mjs', 'account-backend/migrations/0029_finding_assignment_links.sql', 'scripts/finding_links_browser.mjs', 'scripts/verify_finding_links_d1.mjs', 'account-backend/src/finding-remediation.js', 'account-backend/src/remediation-identity.js', 'account-backend/migrations/0028_unified_findings.sql', 'shared-remediation.js', 'scripts/unified_findings_browser.mjs', 'account-backend/migrations/0027_assignment_progress.sql', 'scripts/assignment_progress_browser.mjs', 'scripts/verify_assignment_progress_d1.mjs', 'account-backend/src/remediation-workflow.js', 'account-backend/src/confirmation-host.js', 'account-backend/migrations/0026_remediation_workflow.sql', 'account-backend/tests/remediation-workflow.test.mjs', 'scripts/remediation_workflow_browser.mjs', 'scripts/verify_remediation_workflow_d1.mjs', 'account-backend/src/assignment-*.js', 'account-backend/src/remediation.js', 'account-backend/migrations/0024_assignment_acknowledgements.sql', 'account-backend/migrations/0025_assignment_fyi.sql', 'scripts/assignment_fyi_browser.mjs', 'scripts/verify_assignment_fyi_d1.mjs', 'account-backend/tests/assignment-*.mjs', 'account-backend/tests/helpers/assignment-db.mjs', 'scripts/assignment_ack_browser.mjs', 'scripts/verify_assignment_ack_d1.mjs', '.github/workflows/verify-assignment-acknowledgement.yml']
permissions:
  contents: read
jobs:
  verify:
    name: verify-assignment-acknowledgement / verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --no-package-lock jsdom@26 playwright-core@1.56.1
      - run: npm test --prefix account-backend
      - run: python -m unittest discover -s tests
      - run: python scripts/build_site.py && python scripts/verify_production.py --preflight
      - run: node scripts/worker_release_smoke.mjs && node scripts/browser_smoke.mjs
      - name: Validate Worker packaging and native rate limiting binding without deployment
        working-directory: account-backend
        run: npx --yes wrangler@4.156.0 deploy --dry-run --outdir ../work/acknowledgement-worker
      - name: Exercise guest confirmation and render email/page/tracker review screenshots
        run: node scripts/assignment_ack_browser.mjs
      - name: Exercise optional FYI notifications and receipt updates
        run: node scripts/assignment_fyi_browser.mjs
      - name: Exercise status reasons, assigned severity and confirmation hostname
        run: node scripts/remediation_workflow_browser.mjs
      - name: Exercise verified reviewer progress and severity-based reminders
        run: node scripts/assignment_progress_browser.mjs
      - name: Exercise shared customer findings and remediation records
        run: node scripts/unified_findings_browser.mjs
      - name: Exercise existing assignment linking and customer acknowledgement visibility
        run: node scripts/finding_links_browser.mjs
      - name: Exercise status emails to every participant and render templates
        run: node scripts/status_mail_browser.mjs
      - name: Reproduce status updates before linking and preserve their history
        run: node scripts/status_mail_repair_browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: acknowledgement-review-synthetic-data
          path: |
            work/acknowledgement-review/
            work/fyi-review/
            work/workflow-review/
            work/progress-review/
            work/unified-review/
            work/finding-link-review/
            work/status-mail-review/
            work/mail-repair-review/

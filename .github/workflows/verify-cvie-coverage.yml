name: Verify shared CVIE product coverage without deployment
on:
  push:
    branches: [fix/cvie-product-coverage]
    paths: ['account-backend/**','cvie.js','cvie.css','scripts/*cvie*.mjs','.github/workflows/verify-cvie-coverage.yml']
permissions:
  contents: read
concurrency:
  group: cvie-shared-coverage-verification
  cancel-in-progress: false
jobs:
  verify:
    name: verify-cvie-coverage / verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify shared matching, private account behavior and coverage regression cases
        run: |
          npm test --prefix account-backend
          node account-backend/tests/cvie-coverage.test.mjs
          node account-backend/tests/cvie-audit.test.mjs
      - name: Verify generated site and existing interactions
        run: |
          python -m unittest discover -s tests
          python scripts/build_site.py
          python scripts/verify_production.py --preflight
          npm install --no-save --no-package-lock jsdom@26
          node scripts/browser_smoke.mjs
          node scripts/customer_security_smoke.mjs
          node scripts/cvie_client_smoke.mjs
      - name: Verify the same scan contract against multiple real non-.NET products
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: node scripts/probe_cvie_coverage.mjs
      - name: Verify the shared family plan against real modern .NET history
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: node scripts/probe_cvie_dotnet.mjs
      - name: Require successful live-source checks
        run: node -e "for(const file of ['cvie-coverage-check','cvie-dotnet-check'])if(!require('./data/'+file+'.json').ok)process.exit(1)"
      - name: Retain diagnostic evidence without repository writes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-cvie-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            data/cvie-*-check.json
            data/cvie-catalogue-coverage.json
            docs/cvie-catalogue-coverage.md

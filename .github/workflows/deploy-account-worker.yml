name: Deploy Cloudflare account Worker and D1 remediation schema

on:
  workflow_dispatch:
    inputs:
      backup_confirmed:
        description: 'I have backed up the production D1 cveharbor-accounts database.'
        required: true
        default: false
        type: boolean
      deploy_confirmed:
        description: 'I approve deploying the updated account Worker to production.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cveharbor-production-release
  cancel-in-progress: false

jobs:
  staging-ready:
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Require staging success for this exact commit before production approval
        env:
          SIMPLE_RELEASE_ENABLED: ${{ vars.SIMPLE_RELEASE_ENABLED }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/require_staging_release.mjs
  deploy:
    needs: staging-ready
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOYMENTS_ENABLED == 'true' && inputs.backup_confirmed == true && inputs.deploy_confirmed == true
    name: Migrate existing D1 and deploy authenticated Worker
    runs-on: ubuntu-latest
    environment: cloudflare-worker-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Respect recovery hold before production changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/verify_release_hold.mjs
      - name: Validate Worker JavaScript and digest tests
        run: |
          node --check account-backend/src/index.js
          node --check account-backend/src/remediation.js
          cd account-backend
          npm test
      - name: Confirm Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
      - name: Apply additive production D1 migration
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute cveharbor-accounts --remote --file=./remediation-schema.sql --yes
      - name: Apply additive customer inventory schema
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute cveharbor-accounts --remote --file=./inventory-schema.sql --yes
      - name: Apply additive lifecycle monitoring schema
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute cveharbor-accounts --remote --file=./lifecycle-schema.sql --yes
      - name: Apply additive customer finding status schema
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute cveharbor-accounts --remote --file=./finding-status-schema.sql --yes
      - name: Deploy existing Cloudflare account Worker
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Check deployed Worker health
        run: |
          python - <<'PY'
          import json
          import urllib.request
          request=urllib.request.Request('https://api.cveharbor.com/v1/health',headers={'Accept':'application/json'})
          with urllib.request.urlopen(request,timeout=20) as response:
              payload=json.load(response)
          assert payload['accounts']=='configured'
          print('Account Worker responds to production health checks.')
          print('Assignment email activation remains controlled by Worker runtime settings.')
          PY

      - name: Cover any newly introduced tables with recovery guards
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CVEHARBOR_PROD_WORKER_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CVEHARBOR_PROD_ACCOUNT_ID }}
        run: node scripts/refresh_recovery_guards.mjs

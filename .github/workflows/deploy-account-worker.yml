name: Deploy Cloudflare account Worker and D1 remediation schema

on:
  workflow_dispatch:
    inputs:
      backup_confirmed:
        description: 'I have backed up the production D1 cveharbor-accounts database.'
        required: true
        default: false
        type: boolean
      deploy_confirmed:
        description: 'I approve deploying the updated account Worker to production.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cveharbor-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate existing D1 and deploy authenticated Worker
    if: inputs.backup_confirmed == true && inputs.deploy_confirmed == true
    runs-on: ubuntu-latest
    environment: cloudflare-worker-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker JavaScript and digest tests
        run: |
          node --check account-backend/src/index.js
          node --check account-backend/src/remediation.js
          cd account-backend
          npm test
      - name: Confirm Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID secret'; exit 1; }
      - name: Apply additive production D1 migration
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute cveharbor-accounts --remote --file=./remediation-schema.sql --yes
      - name: Apply additive customer inventory schema
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 execute cveharbor-accounts --remote --file=./inventory-schema.sql --yes
      - name: Deploy existing Cloudflare account Worker
        working-directory: account-backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Check deployed Worker health
        run: |
          python - <<'PY'
          import json
          import urllib.request
          request=urllib.request.Request('https://api.cveharbor.com/v1/health',headers={'Accept':'application/json'})
          with urllib.request.urlopen(request,timeout=20) as response:
              payload=json.load(response)
          assert payload['accounts']=='configured'
          print('Account Worker responds to production health checks.')
          print('Assignment email activation remains controlled by Worker runtime settings.')
          PY

name: Validate isolated product monitoring and inspect readiness without changing production
on:
  workflow_dispatch:
  push:
    branches: [feat/product-lifecycle-monitoring, fix/lifecycle-mockup-and-approved-tests, fix/lifecycle-fluid-layout, fix/lifecycle-equal-panels, codex/lifecycle-product-directory]
    paths: ['account-backend/**', 'lifecycle-monitor*', 'lifecycle-directory*', 'data/lifecycle-products.json', 'product-monitoring.js', 'scripts/*monitor*', '.github/workflows/verify-product-monitoring.yml']
  pull_request:
    paths: ['account-backend/src/monitor*', 'lifecycle-monitor*', 'lifecycle-directory*', 'data/lifecycle-products.json', 'product-monitoring.js', 'account-backend/migrations/0023_lifecycle_monitoring.sql']
permissions:
  contents: read
jobs:
  verify:
    name: verify-product-monitoring / verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm test --prefix account-backend
      - run: npm install --no-save --no-package-lock jsdom@26 playwright-core@1.56.1
      - run: python scripts/build_site.py && node scripts/browser_smoke.mjs && node scripts/product_monitoring_smoke.mjs && node scripts/lifecycle_directory_browser.mjs && node scripts/worker_release_smoke.mjs
      - name: Probe only the reviewed vendor endpoints, without subscriptions or email
        run: node scripts/probe_monitor_sources.mjs && node scripts/probe_lifecycle_directory.mjs
      - name: Capture reference, wide and mobile lifecycle layouts
        run: node scripts/lifecycle_visual_check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lifecycle-design-evidence
          path: |
            work/lifecycle-*.png
            work/lifecycle-responsive-measurements.json
            public/lifecycle.js

  production-readonly:
    name: verify-product-monitoring production metadata
    if: github.repository == 'Prat007ai/cveharbor' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: cloudflare-production-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Inspect deployed binding names, flags and schema metadata only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_AUDIT_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json,sys,os
          sys.path.insert(0,'scripts')
          from deploy_site_gate import cloudflare
          from verify_cvie_production import query
          settings=cloudflare('/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/workers/scripts/cveharbor-accounts/settings')
          bindings=settings.get('bindings',[])
          names=[b.get('name') for b in bindings if b.get('type')=='secret_text']
          flags={b.get('name'):b.get('text') for b in bindings if b.get('type')=='plain_text' and b.get('name') in ['EMAIL_FROM','LIFECYCLE_DELIVERY_ENABLED','PRODUCT_MONITOR_CHECKS_ENABLED','PRODUCT_MONITOR_DELIVERY_ENABLED','PRODUCT_MONITOR_TEST_ENABLED']}
          tables=query("SELECT name FROM sqlite_master WHERE type='table' AND (name LIKE 'lifecycle_%' OR name LIKE 'monitor_%') ORDER BY name")
          report={'secret_binding_names':names,'flags':flags,'tables':[t['name'] for t in tables],'production_writes':0,'smtp2go_account_settings':'not accessible through Worker secret metadata'}
          print(json.dumps(report))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:output.write('Read-only readiness metadata; no customer rows or secret values.\n\n```json\n'+json.dumps(report,indent=2)+'\n```\n')
          PY

      - name: Retain diagnostic evidence without repository writes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-product-monitoring-production-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            data/cvie-*-runtime-check.json
            data/cvie-runtime-check.json
